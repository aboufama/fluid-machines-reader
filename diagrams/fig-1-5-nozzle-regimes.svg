<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1440" role="img"><title>Nine nozzle flow regimes with increasing pressure ratio</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="550" y="35" class="title" text-anchor="middle">Shock structure as pressure ratio increases</text><text x="550" y="64" class="small" text-anchor="middle">Handwritten source ratios use p₀/p∞; the printed caption uses p₀/p<tspan baseline-shift="sub" font-size="70%" font-style="normal">e</tspan>.</text><text x="40" y="105" class="title" text-anchor="start">a)  p₀/p∞ = 1.02</text><text x="40" y="132" class="small" text-anchor="start">Subsonic flow</text><path d="M45 175C110 180 105 213 140 210S235 180 285 180M45 290C110 285 105 252 140 255S235 285 285 285" class="wall" /><text x="40" y="365" class="title" text-anchor="start">b)  p₀/p∞ = 1.23</text><text x="40" y="392" class="small" text-anchor="start">Internal normal shock</text><path d="M45 435C110 440 105 473 140 470S235 440 285 440M45 550C110 545 105 512 140 515S235 545 285 545" class="wall" /><path d="M151.6 467.6L151.6 517.4" class="wall" /><text x="322" y="485" class="small" text-anchor="start">Normal</text><text x="322" y="507" class="small" text-anchor="start">shock</text><path d="M318 491L154.6 491" class="flow" /><text x="40" y="625" class="title" text-anchor="start">c)  p₀/p∞ = 2.36</text><text x="40" y="652" class="small" text-anchor="start">Internal normal shock</text><path d="M45 695C110 700 105 733 140 730S235 700 285 700M45 810C110 805 105 772 140 775S235 805 285 805" class="wall" /><path d="M195.1 718.6L195.1 786.4" class="wall" /><text x="322" y="745" class="small" text-anchor="start">Normal</text><text x="322" y="767" class="small" text-anchor="start">shock</text><path d="M318 751L198.1 751" class="flow" /><text x="40" y="885" class="title" text-anchor="start">d)  p₀/p∞ = 2.78</text><text x="40" y="912" class="small" text-anchor="start">Internal normal shock</text><path d="M45 955C110 960 105 993 140 990S235 960 285 960M45 1070C110 1065 105 1032 140 1035S235 1065 285 1065" class="wall" /><path d="M235.7 970.2L235.7 1054.8" class="wall" /><text x="322" y="1005" class="small" text-anchor="start">Normal</text><text x="322" y="1027" class="small" text-anchor="start">shock</text><path d="M318 1011L238.7 1011" class="flow" /><text x="40" y="1145" class="title" text-anchor="start">e)  p₀/p∞ = 3.18</text><text x="40" y="1172" class="small" text-anchor="start">Normal shock near exit</text><path d="M45 1215C110 1220 105 1253 140 1250S235 1220 285 1220M45 1330C110 1325 105 1292 140 1295S235 1325 285 1325" class="wall" /><path d="M277.75 1221.5L277.75 1323.5" class="wall" /><text x="322" y="1265" class="small" text-anchor="start">Normal</text><text x="322" y="1287" class="small" text-anchor="start">shock</text><path d="M318 1271L280.75 1271" class="flow" /><text x="590" y="105" class="title" text-anchor="start">f)  p₀/p∞ = 7</text><text x="590" y="132" class="small" text-anchor="start">Overexpanded exhaust</text><path d="M595 175C660 180 655 213 690 210S785 180 835 180M595 290C660 285 655 252 690 255S785 285 835 285" class="wall" /><path d="M835 180L890 231L950 190L1010 231L1065 200M835 285L890 231L950 273L1010 231L1065 263" class="line" /><text x="850" y="321" class="small" text-anchor="start">Oblique shocks → expansion fans</text><text x="890" y="344" class="small" text-anchor="start">→ compression fans</text><text x="590" y="365" class="title" text-anchor="start">g)  p₀/p∞ = 15</text><text x="590" y="392" class="small" text-anchor="start">Overexpanded exhaust</text><path d="M595 435C660 440 655 473 690 470S785 440 835 440M595 550C660 545 655 512 690 515S785 545 835 545" class="wall" /><path d="M835 440L890 491L950 450L1010 491L1065 460M835 545L890 491L950 533L1010 491L1065 523" class="line" /><path d="M882 481L882 503" class="wall" /><text x="875" y="581" class="small" text-anchor="start">Normal shock / shock cell</text><text x="890" y="604" class="small" text-anchor="start">→ compression fans</text><text x="590" y="625" class="title" text-anchor="start">h)  p₀/p∞ = 31</text><text x="590" y="652" class="small" text-anchor="start">Design condition</text><path d="M595 695C660 700 655 733 690 730S785 700 835 700M595 810C660 805 655 772 690 775S785 805 835 805" class="wall" /><path d="M835 700L1000 805M835 805L1000 700" class="line dash" /><text x="860" y="838" class="small" text-anchor="start">Weak Mach waves</text><text x="590" y="885" class="title" text-anchor="start">i)  p₀/p∞ = 50</text><text x="590" y="912" class="small" text-anchor="start">Underexpanded exhaust</text><path d="M595 955C660 960 655 993 690 990S785 960 835 960M595 1070C660 1065 655 1032 690 1035S785 1065 835 1065" class="wall" /><path d="M835 960Q940 903 1060 955M835 1065Q940 1120 1060 1069" class="line" /><path d="M835 960L935 1077" class="line dash" /><path d="M835 1065L935 949" class="line dash" /><path d="M835 960L947 1065" class="line dash" /><path d="M835 1065L947 961" class="line dash" /><path d="M835 960L959 1053" class="line dash" /><path d="M835 1065L959 973" class="line dash" /><text x="847" y="1120" class="small" text-anchor="start">Expansion → compression fans</text><text x="820" y="1250" class="" text-anchor="start">Flow direction →</text><text x="820" y="1280" class="small" text-anchor="middle">Shock/fan geometry is schematic.</text></svg>