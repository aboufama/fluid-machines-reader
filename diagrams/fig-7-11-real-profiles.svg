<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1010" role="img"><title>Inviscid and real actuator-disk centerline profiles</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="35" class="title" text-anchor="start">Inviscid prediction and real wake</text><text x="180" y="97" class="" text-anchor="start">Inviscid solution</text><text x="760" y="97" class="" text-anchor="start">Real solution</text><path d="M135 125V790M135 140H505" class="wall" /><path d="M135 439.0L505 439.0" class="line dash" /><text x="505" y="430.0" class="small" text-anchor="end">Disk</text><path d="M170 140L170 364.0C170 414.0 308.5 433.0 338.5 439.0C383.5 449.0 475 454.0 475 494.0L475 790" class="line" style="stroke:#285e75;stroke-width:3"/><path d="M235 140L235 369.0Q235 419.0 180 439.0L435 439.0Q235 454.0 235 524.0V790" class="line" /><path d="M235 140V439.0H435V790" class="line" style="stroke:#b27b37;stroke-dasharray:7 5"/><text x="168" y="170" class="small" text-anchor="start">U</text><text x="213" y="236" class="small" text-anchor="start">p</text><text x="250" y="210" class="small" text-anchor="start">p + ½ρU²</text><text x="175" y="784" class="small" text-anchor="start"></text><text x="215" y="745" class="small" text-anchor="start">p</text><text x="480" y="785" class="small" text-anchor="start">U</text><path d="M710 125V790M710 140H1080" class="wall" /><path d="M710 439.0L1080 439.0" class="line dash" /><text x="1080" y="430.0" class="small" text-anchor="end">Disk</text><path d="M745 140L745 364.0C745 414.0 883.5 433.0 913.5 439.0C958.5 449.0 1050 454.0 1050 494.0C1050 569.0 745 650 745 790" class="line" style="stroke:#285e75;stroke-width:3"/><path d="M810 140L810 369.0Q810 419.0 755 439.0L1010 439.0Q810 454.0 810 524.0V790" class="line" /><path d="M810 140V439.0H1010C1010 579.0 810 650 810 790" class="line" style="stroke:#b27b37;stroke-dasharray:7 5"/><text x="743" y="170" class="small" text-anchor="start">U</text><text x="788" y="236" class="small" text-anchor="start">p</text><text x="825" y="210" class="small" text-anchor="start">p + ½ρU²</text><text x="750" y="784" class="small" text-anchor="start">U</text><text x="790" y="745" class="small" text-anchor="start">p</text><text x="1055" y="785" class="small" text-anchor="start"></text><text x="36" y="305" class="small" text-anchor="start">Bernoulli</text><text x="36" y="328" class="small" text-anchor="start">applies</text><text x="36" y="462" class="small" text-anchor="start">Fails at</text><text x="36" y="485" class="small" text-anchor="start">the disk</text><text x="36" y="635" class="small" text-anchor="start">Bernoulli</text><text x="36" y="658" class="small" text-anchor="start">applies</text><text x="555" y="317" class="small" text-anchor="middle">Pressure jump</text><text x="555" y="341" class="small" text-anchor="middle">and force at</text><text x="555" y="365" class="small" text-anchor="middle">rotor mostly</text><text x="555" y="389" class="small" text-anchor="middle">correct.</text><text x="555" y="571" class="small" text-anchor="middle">Inviscid wake</text><text x="555" y="595" class="small" text-anchor="middle">persists; real</text><text x="555" y="619" class="small" text-anchor="middle">wake decays.</text><text x="35" y="863" class="" text-anchor="start">Viscous effects in the real wake dissipate the velocity induced by the actuator disk.</text><text x="35" y="901" class="small" text-anchor="start">The source calls the inviscid far-wake prediction “totally wrong.”</text><text x="35" y="940" class="small" text-anchor="start">Qualitative reconstruction: flow proceeds downward; pressure and velocity have separate horizontal scales.</text><text x="35" y="974" class="small" text-anchor="start">Stagnation pressure: p + ½ρU². Velocity: U. Static pressure: p.</text></svg>