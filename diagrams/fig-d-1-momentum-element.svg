<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 660" role="img"><title>Six outward x-momentum fluxes and pressure forces on a Cartesian element</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="25" y="35" class="title" text-anchor="start">Differential Cartesian control volume</text><text x="600" y="35" class="title" text-anchor="start">Taylor values and outward fluxes</text><path d="M145 205 H370 V430 H145 Z M145 205 L235 150 H460 V375 L370 430 M370 205 L460 150" class="wall" /><path d="M235 150 V375 H460 M145 430 L235 375" class="line dash" /><path d="M293 176L293 95" class="flow" /><text x="302" y="111" class="" text-anchor="start">Jtop</text><path d="M290 430L290 502" class="flow" /><text x="299" y="494" class="" text-anchor="start">Jbottom</text><path d="M160 285L55 285" class="flow" /><text x="41" y="269" class="" text-anchor="start">Jleft</text><path d="M415 285L515 285" class="flow" /><text x="465" y="269" class="" text-anchor="start">Jright</text><path d="M257 324L192 366" class="flow" /><text x="154" y="394" class="" text-anchor="start">Jfront</text><path d="M350 227L425 180" class="flow" /><text x="407" y="167" class="" text-anchor="start">Jback</text><path d="M55 330L140 330" class="flow" /><text x="39" y="351" class="" text-anchor="start">Pleft</text><path d="M536 330L447 330" class="flow" /><text x="473" y="351" class="" text-anchor="start">Pright</text><path d="M145 537L370 537" class="dim" /><text x="249" y="558" class="" text-anchor="start">Δx</text><path d="M109 205L109 430" class="dim" /><text x="68" y="411" class="" text-anchor="start">Δy</text><path d="M400 451L481 397" class="dim" /><text x="456" y="447" class="" text-anchor="start">Δz</text><path d="M450 551L516 551" class="flow" /><text x="525" y="557" class="" text-anchor="start">x</text><path d="M450 551L450 490" class="flow" /><text x="442" y="480" class="" text-anchor="start">y</text><path d="M450 551L411 580" class="flow" /><text x="398" y="601" class="" text-anchor="start">z</text><text x="600" y="78" class="" text-anchor="start">For a = u, v, w or p:</text><text x="600" y="109" class="" text-anchor="start">a[i±] = a ± (Δi/2) ∂a/∂i</text><text x="600" y="155" class="" text-anchor="start">Ax = Δy Δz    Ay = Δx Δz    Az = Δx Δy</text><text x="600" y="208" class="" text-anchor="start">Jleft = ρ u[x−] (−u[x−]) Ax</text><text x="600" y="247" class="" text-anchor="start">Jright = ρ u[x+] u[x+] Ax</text><text x="600" y="286" class="" text-anchor="start">Jbottom = ρ u[y−] (−v[y−]) Ay</text><text x="600" y="325" class="" text-anchor="start">Jtop = ρ u[y+] v[y+] Ay</text><text x="600" y="364" class="" text-anchor="start">Jback = ρ u[z−] (−w[z−]) Az</text><text x="600" y="403" class="" text-anchor="start">Jfront = ρ u[z+] w[z+] Az</text><text x="600" y="462" class="" text-anchor="start">Pleft = p[x−] Ax  →</text><text x="600" y="501" class="" text-anchor="start">Pright = p[x+] Ax  ←</text><text x="600" y="551" class="" text-anchor="start">u⃗ = (u, v, w);  ρ fixed</text><text x="25" y="631" class="small" text-anchor="start">Flux arrows identify outward face normals; signs reside in J. Full expanded formulas accompany the figure.</text></svg>