<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 790" role="img" aria-labelledby="title desc"><title id="title">Reservoir emptied by a siphon</title><desc id="desc">Open reservoir of area A1 with initial water level h0 above datum z0. Siphon area A2 rises over the rim, enters nearly to the bottom, and discharges at z0. Axes x,y,z are shown.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:19px;fill:#172e3c}.small{font-size:16px}.math{font-family:Georgia,serif;font-style:italic;font-size:22px}.wall{fill:none;stroke:#172e3c;stroke-width:3;stroke-linejoin:round}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#arrow)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#arrow);marker-end:url(#arrow)}.water{fill:#e7f3f7;stroke:none}.dash{stroke-dasharray:7 6}</style><rect width="100%" height="100%" fill="white"/><path d="M150 160V650A235 48 0 0 0 620 650V160" class="wall"/><ellipse cx="385" cy="160" rx="235" ry="58" class="wall"/><path d="M151 250A235 35 0 0 0 619 250V650A235 48 0 0 1 151 650Z" class="water"/><path d="M150 250A235 35 0 0 0 620 250" class="line dash"/><path d="M150 650A235 48 0 0 1 620 650" class="line dash"/><path d="M565 631V157A38 38 0 0 1 641 157V674M584 631V157A19 19 0 0 1 622 157V674" fill="white" stroke="#172e3c" stroke-width="3"/><text x="113" y="66" class="" text-anchor="start">Exposed to atmosphere</text><path d="M210 77L222 148" class="flow"/><text x="429" y="45" class="" text-anchor="start">Cross-sectional area A₁</text><path d="M477 59L448 133" class="flow"/><text x="230" y="320" class="" text-anchor="start">Initial water level</text><text x="670" y="255" class="math" text-anchor="start">z = h₀</text><text x="670" y="663" class="math" text-anchor="start">z = 0</text><path d="M111 250L111 650" class="dim"/><text x="75" y="455" class="math" text-anchor="start">h₀</text><text x="683" y="496" class="" text-anchor="start">Cross-sectional</text><text x="683" y="524" class="" text-anchor="start">area A₂</text><path d="M680 537L645 580" class="flow"/><text x="250" y="555" class="" text-anchor="start">Extends almost,</text><text x="250" y="582" class="" text-anchor="start">but not quite, to bottom</text><path d="M470 620L562 630" class="flow"/><path d="M590 749L650 749" class="flow"/><path d="M590 749L590 700" class="flow"/><path d="M590 749L623 717" class="flow"/><text x="658" y="755" class="math" text-anchor="start">x</text><text x="584" y="693" class="math" text-anchor="start">z</text><text x="629" y="716" class="math" text-anchor="start">y</text></svg>