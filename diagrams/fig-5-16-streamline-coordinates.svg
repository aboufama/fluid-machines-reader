<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img"><title>Local streamline coordinates and circles of curvature</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="35" class="title" text-anchor="start">Streamline coordinates</text><path d="M40 280 C80 318 110 330 160 330 A100 100 0 0 0 255 261 C310 168 374 269 470 250 A110 110 0 0 0 580 140" class="wall" /><path d="M260 230A100 100 0 1 1 60 230A100 100 0 1 1 260 230" class="line dash" /><circle cx="160.00" cy="230.00" r="3" fill="#285e75"/><path d="M160 230L89.3 300.7" class="dim" /><text x="100.0" y="280.0" class="" text-anchor="start">R</text><circle cx="160.00" cy="330.00" r="5" fill="#285e75"/><path d="M160 330L235 330" class="flow" /><text x="243" y="336" class="" text-anchor="start">ŝ</text><path d="M160 330L160 260" class="flow" /><text x="172" y="264" class="" text-anchor="start">n̂</text><path d="M150 330A10 10 0 1 1 170 330A10 10 0 1 1 150 330" class="line" /><circle cx="160.00" cy="330.00" r="2" fill="#285e75"/><text x="133" y="361" class="" text-anchor="middle">ℓ̂</text><path d="M580 140A110 110 0 1 1 360 140A110 110 0 1 1 580 140" class="line dash" /><circle cx="470.00" cy="140.00" r="3" fill="#285e75"/><path d="M470 140L392.23 217.76999999999998" class="dim" /><text x="405.0" y="195.0" class="" text-anchor="start">R</text><circle cx="470.00" cy="250.00" r="5" fill="#285e75"/><path d="M470 250L545 250" class="flow" /><text x="553" y="256" class="" text-anchor="start">ŝ</text><path d="M470 250L470 180" class="flow" /><text x="482" y="184" class="" text-anchor="start">n̂</text><path d="M460 250A10 10 0 1 1 480 250A10 10 0 1 1 460 250" class="line" /><circle cx="470.00" cy="250.00" r="2" fill="#285e75"/><text x="443" y="281" class="" text-anchor="middle">ℓ̂</text><text x="655" y="90" class="" text-anchor="start">Local circles of curvature</text><text x="655" y="145" class="" text-anchor="start">ŝ  tangent to the flow</text><text x="655" y="185" class="" text-anchor="start">n̂  toward the center</text><text x="655" y="225" class="" text-anchor="start">ℓ̂ = ŝ × n̂</text><text x="655" y="252" class="small" text-anchor="start">⊙  out of the plane</text><text x="35" y="420" class="small" text-anchor="start">The coordinate directions follow the streamline and change with position.</text></svg>