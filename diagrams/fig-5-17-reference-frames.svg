<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img"><title>Lagrangian and Eulerian views of river flow</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="40" class="title" text-anchor="start">Lagrangian — follow a fluid element</text><path d="M30 115Q300 55 870 110L870 260Q390 230 30 290Z" class="" fill="#edf5f7"/><path d="M30 115Q300 55 870 110M30 290Q390 230 870 260" class="line" /><path d="M490 90L850 105L850 165Q790 92 735 160Q670 87 615 152Q550 83 490 145Z" class="wall" style="fill:#e5e8e6"/><path d="M70 165L180 165" class="flow" /><path d="M510 205L620 205" class="flow" /><path d="M710 215L820 215" class="flow" /><path d="M260 220Q325 198 390 220Q365 246 285 235Z" class="wall" style="fill:#efe0c5"/><circle cx="325.00" cy="162.00" r="10" fill="#172e3c"/><path d="M325 174L325 207" class="wall" /><path d="M308 191L325 182L342 192M325 207L311 228M325 207L339 228" class="wall" /><path d="M410 220L465 220" class="flow" /><text x="110" y="322" class="small" text-anchor="start">Observer travels with the moving fluid element.</text><text x="30" y="350" class="title" text-anchor="start">Eulerian — observe a fixed location</text><path d="M30 425Q300 365 870 420L870 570Q390 540 30 600Z" class="" fill="#edf5f7"/><path d="M30 425Q300 365 870 420M30 600Q390 540 870 570" class="line" /><path d="M490 400L850 415L850 475Q790 402 735 470Q670 397 615 462Q550 393 490 455Z" class="wall" style="fill:#e5e8e6"/><path d="M70 475L180 475" class="flow" /><path d="M510 515L620 515" class="flow" /><path d="M710 525L820 525" class="flow" /><path d="M260 530Q325 508 390 530Q365 556 285 545Z" class="wall" style="fill:#efe0c5"/><circle cx="400.00" cy="573.00" r="10" fill="#172e3c"/><path d="M400 585L400 618" class="wall" /><path d="M383 602L400 593L417 603M400 618L386 639M400 618L414 639" class="wall" /><text x="475" y="616" class="small" text-anchor="start">Observer stays at a fixed location.</text></svg>