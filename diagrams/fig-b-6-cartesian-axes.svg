<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 435" role="img"><title>Cartesian coordinates and fixed unit vectors</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="34" class="title" text-anchor="start">Cartesian coordinates</text><path d="M300 260L550 260" class="flow" /><text x="560" y="269" class="" text-anchor="start">x</text><path d="M300 260L300 85" class="flow" /><text x="310" y="94" class="" text-anchor="start">y</text><path d="M300 260L130 390" class="flow" /><text x="140" y="399" class="" text-anchor="start">z</text><text x="595" y="89" class="" text-anchor="middle">Unit vectors</text><path d="M580 170L645 170" class="flow" /><text x="612.5" y="158.0" class="" text-anchor="start">x̂</text><path d="M580 253L580 188" class="flow" /><text x="598.0" y="220.5" class="" text-anchor="start">ŷ</text><path d="M622 284L571 323" class="flow" /><text x="611.5" y="323.5" class="" text-anchor="start">ẑ</text></svg>