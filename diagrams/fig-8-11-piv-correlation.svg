<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" role="img"><title>Particle-image cross correlation and velocity estimate</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="35" class="title" text-anchor="start">Cross-correlation for particle-image velocimetry</text><rect x="35" y="110" width="235" height="235" fill="#fff" stroke="#285e75" stroke-width="2"/><text x="152" y="384" class="" text-anchor="middle">First image</text><circle cx="74.00" cy="184.00" r="4" fill="#285e75"/><circle cx="117.00" cy="141.00" r="4" fill="#285e75"/><circle cx="178.00" cy="172.00" r="4" fill="#285e75"/><circle cx="201.00" cy="244.00" r="4" fill="#285e75"/><circle cx="109.00" cy="272.00" r="4" fill="#285e75"/><circle cx="160.00" cy="298.00" r="4" fill="#285e75"/><rect x="320" y="110" width="235" height="235" fill="#fff" stroke="#285e75" stroke-width="2"/><text x="437" y="384" class="" text-anchor="middle">Second image</text><circle cx="381.00" cy="164.00" r="4" fill="#285e75"/><circle cx="424.00" cy="121.00" r="4" fill="#285e75"/><circle cx="485.00" cy="152.00" r="4" fill="#285e75"/><circle cx="508.00" cy="224.00" r="4" fill="#285e75"/><circle cx="416.00" cy="252.00" r="4" fill="#285e75"/><circle cx="467.00" cy="278.00" r="4" fill="#285e75"/><rect x="605" y="110" width="235" height="235" fill="#fff" stroke="#285e75" stroke-width="2"/><text x="722" y="384" class="" text-anchor="middle">Cross-correlation</text><path d="M784 175A8 5.6 0 1 1 768 175A8 5.6 0 1 1 784 175" class="line" /><path d="M794 175A18 12.6 0 1 1 758 175A18 12.6 0 1 1 794 175" class="line" /><path d="M811 175A35 24.5 0 1 1 741 175A35 24.5 0 1 1 811 175" class="line" /><path d="M834 175A58 40.599999999999994 0 1 1 718 175A58 40.599999999999994 0 1 1 834 175" class="line" /><circle cx="776.00" cy="175.00" r="4" fill="#285e75"/><text x="621" y="325" class="small" text-anchor="start">Correlation peak</text><rect x="890" y="110" width="235" height="235" fill="#fff" stroke="#285e75" stroke-width="2"/><text x="1007" y="384" class="" text-anchor="middle">Best velocity estimate</text><path d="M972 263L1061 175" class="flow" /><text x="30" y="437" class="small" text-anchor="start">Illustrative particle positions and correlation contours; displacement determines the velocity estimate.</text></svg>