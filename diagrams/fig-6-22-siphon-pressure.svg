<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 1060" role="img"><title>Pressure distribution along a siphon path from A through F</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="35" class="title" text-anchor="start">Pressure along the siphon path</text><path d="M100 580.0000000000005L890 580.0000000000005" class="grid" /><text x="88" y="585.0000000000005" class="small" text-anchor="end">0.97</text><path d="M100 488.0000000000003L890 488.0000000000003" class="grid" /><text x="88" y="493.0000000000003" class="small" text-anchor="end">0.98</text><path d="M100 396.0000000000002L890 396.0000000000002" class="grid" /><text x="88" y="401.0000000000002" class="small" text-anchor="end">0.99</text><path d="M100 304.0000000000001L890 304.0000000000001" class="grid" /><text x="88" y="309.0000000000001" class="small" text-anchor="end">1.00</text><path d="M100 212.00000000000006L890 212.00000000000006" class="grid" /><text x="88" y="217.00000000000006" class="small" text-anchor="end">1.01</text><path d="M100 120.0L890 120.0" class="grid" /><text x="88" y="125.0" class="small" text-anchor="end">1.02</text><text x="100.0" y="607" class="" text-anchor="middle">A</text><text x="258.0" y="607" class="" text-anchor="middle">B</text><text x="416.0" y="607" class="" text-anchor="middle">C</text><text x="574.0" y="607" class="" text-anchor="middle">D</text><text x="732.0" y="607" class="" text-anchor="middle">E</text><text x="890.0" y="607" class="" text-anchor="middle">F</text><path d="M100 100V580H890" class="wall" /><text x="35" y="85" class="" text-anchor="start">p (bar)</text><text x="430" y="641" class="" text-anchor="middle">Distances are not to scale</text><path d="M100.0 304.0000000000001L258.0 120.0H416.0C526.6 120.0 550.3 193.60000000000008 574.0 304.0000000000001L732.0 580.0000000000005L890.0 304.0000000000001" class="" fill="none" stroke="#172e3c" stroke-width="4"/><path d="M100.0 304.0000000000001L258.0 120.0H416.0C526.6 120.0 558.2 184.40000000000106 574.0 212.00000000000006L732.0 534.0000000000003L890.0 304.0000000000001" class="" fill="none" stroke="#b17c46" stroke-width="3"/><path d="M80 690L125 690" class="wall" /><text x="140" y="696" class="" text-anchor="start">Inviscid</text><path d="M375.00 690.00L420.00 690.00" class="" fill="none" stroke="#b17c46" stroke-width="2.5" stroke-dasharray=""/><text x="435" y="696" class="" text-anchor="start">With viscous effects</text><text x="35" y="749" class="small" text-anchor="start">A → B: hydrostatic equation. B → C: hydrostatic equation (constant elevation).</text><text x="35" y="780" class="small" text-anchor="start">C → D: pressure drop per Bernoulli to atmospheric pressure in the inviscid case.</text><text x="35" y="811" class="small" text-anchor="start">With viscosity: pressure drops only about halfway to atmospheric because fluid is slower.</text><text x="35" y="842" class="small" text-anchor="start">D → E → F: Bernoulli with uniform Ū gives the hydrostatic pressure gradient if inviscid.</text><text x="35" y="873" class="small" text-anchor="start">With viscosity: z is the same and Ū is still uniform throughout the pipe, but viscous losses</text><text x="35" y="904" class="small" text-anchor="start">cause B to drop downstream; pressure drops relative to the inviscid case.</text><text x="35" y="935" class="small" text-anchor="start">The pressure distribution between C and D requires the velocity distribution near the</text><text x="35" y="966" class="small" text-anchor="start">siphon inlet (for example, a potential sink).</text><text x="35" y="1035" class="small" text-anchor="start">Approximate redraw of the source’s hand-drawn pressure curves.</text></svg>