<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 990" role="img"><title>Z-type schlieren optical setup with two concave mirrors</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="35" class="title" text-anchor="start">Schlieren setup for an air duster</text><rect x="55" y="114" width="153" height="60" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="71" y="150" class="" text-anchor="start">Light source</text><path d="M977 255Q1000 315 977 375" class="wall" /><text x="1003" y="299" class="" text-anchor="start">Concave</text><text x="1003" y="327" class="" text-anchor="start">mirror 1</text><path d="M165 408Q142 461 165 514" class="wall" /><text x="35" y="437" class="small" text-anchor="start">Concave</text><text x="35" y="462" class="small" text-anchor="start">mirror 2</text><path d="M208 150L977 272L165 418L852 676L1117 775.598" class="line" style="stroke:#b27b37;stroke-width:1.8"/><path d="M208 150L977 315L165 461L852 676L1117 759.0" class="line" style="stroke:#b27b37;stroke-width:1.8"/><path d="M208 150L977 358L165 504L852 676L1117 742.402" class="line" style="stroke:#b27b37;stroke-width:1.8"/><path d="M461 392L341 414" class="flow" /><path d="M420 195L570 225" class="flow" /><path d="M393 532L507 568" class="flow" /><path d="M390 335L433 292L455 317L415 360Z" class="wall" /><path d="M451 311L547 365" class="wall" /><text x="344" y="272" class="" text-anchor="start">Air duster</text><path d="M547 365Q566 367 579 386Q590 395 611 394M547 365Q554 384 570 399Q584 414 608 412" class="line dash" /><text x="490" y="485" class="" text-anchor="start">Collimated region</text><text x="490" y="511" class="small" text-anchor="start">Place the object to image here.</text><path d="M830 697L855 653L870 660L845 704Z" class="wall" /><text x="872" y="637" class="" text-anchor="start">Razor blade</text><text x="864" y="613" class="small" text-anchor="start">At the focus</text><path d="M1113 664L1113 846" class="wall" /><text x="1040" y="879" class="" text-anchor="start">Paper or screen</text><text x="736" y="183" class="" text-anchor="start">ℓ₁ = f = 1 m</text><text x="571" y="372" class="" text-anchor="start">ℓ₂</text><text x="494" y="647" class="" text-anchor="start">ℓ₃ = f = 1 m</text><text x="891" y="318" class="" text-anchor="start">θ₁</text><text x="224" y="465" class="" text-anchor="start">θ₂</text><text x="30" y="795" class="small" text-anchor="start">θ₁: as small as possible to minimize mirror aberration.</text><text x="30" y="824" class="small" text-anchor="start">θ₂: same as θ₁. The mirror separation ℓ₂ is not critical.</text><path d="M168 910A42 42 0 1 1 84 910A42 42 0 1 1 168 910" class="line" /><text x="126" y="977" class="small" text-anchor="middle">Silhouette image</text><path d="M527 910A42 42 0 1 1 443 910A42 42 0 1 1 527 910" class="line" /><text x="485" y="977" class="small" text-anchor="middle">Focused beam / razor</text><path d="M884 910A42 42 0 1 1 800 910A42 42 0 1 1 884 910" class="line" /><text x="842" y="977" class="small" text-anchor="middle">Schlieren image</text><path d="M87 920L140 900" class="wall" style="stroke-width:9"/><rect x="442" y="914" width="86" height="24" fill="#172e3c" stroke="#285e75" stroke-width="2"/><path d="M803 920L850 902" class="wall" style="stroke-width:9"/><path d="M851 902Q866 897 880 882M851 908Q865 910 880 902" class="line" /></svg>