<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 580" role="img"><title>Top and side views of a vessel with a central siphon</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="525" y="34" class="title" text-anchor="middle">Container with a siphon in the centre column</text><text x="260" y="93" class="" text-anchor="middle">Top view</text><circle cx="260.00" cy="320.00" r="182" fill="#e7dcc6"/><circle cx="260.00" cy="320.00" r="166" fill="#fff"/><circle cx="260.00" cy="320.00" r="51" fill="#e7dcc6"/><circle cx="250.00" cy="320.00" r="10" fill="#fff"/><circle cx="285.00" cy="320.00" r="8" fill="#fff"/><text x="353" y="270" class="small" text-anchor="start">Small hole</text><text x="353" y="294" class="small" text-anchor="start">at bottom</text><path d="M344 300L296 316" class="flow" /><text x="780" y="93" class="" text-anchor="middle">Side view</text><path d="M602 170V488H734V270Q734 214 780 214Q826 214 826 270V451H809V270Q809 232 780 232Q751 232 751 270V507H585V170Z M763 507V271Q763 249 780 249V488H956V170H974V507Z" class="" fill="#e7dcc6" stroke="#956b3d" stroke-width="2"/><path d="M552 251L552 488" class="dim" /><text x="529" y="374" class="" text-anchor="start">h</text><text x="525" y="555" class="small" text-anchor="middle">The passage rises inside the column, turns at its crest and exits through the base.</text></svg>