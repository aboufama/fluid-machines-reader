<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1000" role="img"><title>Collective: uniform blade-pitch increase</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="35" class="title" text-anchor="start">Collective: uniform blade-pitch increase</text><text x="35" y="88" class="" text-anchor="start">A · Pilot input</text><rect x="40" y="120" width="310" height="150" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><path d="M115 235L190 170" class="wall" /><circle cx="115.00" cy="235.00" r="9" fill="#285e75"/><path d="M230 217L230 145" class="flow" /><text x="55" y="302" class="" text-anchor="start">Raise the collective lever.</text><path d="M375 195L470 195" class="flow" /><text x="490" y="170" class="" text-anchor="start">Control signal sets blade pitch</text><text x="490" y="200" class="" text-anchor="start">through the swash plate (source label).</text><text x="35" y="363" class="" text-anchor="start">B · Resulting blade pitch</text><path d="M391 490A96 96 0 1 1 199 490A96 96 0 1 1 391 490" class="line" /><path d="M199 490L391 490" class="line" /><path d="M295 394L295 586" class="line" /><text x="295" y="377" class="small" text-anchor="middle">Fore 90°</text><text x="295" y="611" class="small" text-anchor="middle">Aft 270°</text><text x="189" y="480" class="small" text-anchor="end">180° left</text><text x="401" y="480" class="small" text-anchor="start">0° right</text><path d="M354 480Q347 436 305 431" class="flow" /><text x="295" y="638" class="small" text-anchor="middle">Rotor-blade path (top view)</text><path d="M630 395V555H970" class="wall" /><text x="620" y="377" class="" text-anchor="start">Pitch angle α</text><text x="978" y="560" class="" text-anchor="start">θ</text><text x="630" y="580" class="small" text-anchor="middle">0°</text><text x="710" y="580" class="small" text-anchor="middle">90°</text><text x="790" y="580" class="small" text-anchor="middle">180°</text><text x="870" y="580" class="small" text-anchor="middle">270°</text><text x="950" y="580" class="small" text-anchor="middle">360°</text><path d="M630 480L950 480" class="line dash" /><text x="951" y="476" class="small" text-anchor="start">Trim</text><path d="M630 425L950 425" class="line" /><text x="655" y="414" class="small" text-anchor="start">Higher pitch throughout</text><text x="35" y="700" class="" text-anchor="start">C · Resulting motion</text><g transform="translate(115 755) scale(0.83)"><path d="M10 110Q25 40 110 55L145 85L300 90L335 60L342 115L147 116Q130 150 65 145Q10 148 10 110Z" class="wall" /><path d="M105 57L105 25" class="wall" /><path d="M-15 25L225 25" class="wall" /><path d="M50 145V166H145V143M25 166H171" class="wall" /><path d="M330 80L355 127M354 78L325 130" class="wall" /></g><path d="M208 772L208 720" class="flow" /><text x="480" y="800" class="" text-anchor="start">High rotor pitch gives greater lift and climb.</text><text x="480" y="837" class="small" text-anchor="start">Uniform pitch around the entire rotor path.</text><text x="480" y="870" class="small" text-anchor="start">Rotor spins counterclockwise viewed from above.</text><text x="30" y="983" class="small" text-anchor="start">Schematic redrawing of the source’s A → B → C control sequence.</text></svg>