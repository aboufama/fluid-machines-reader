<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 585" role="img"><title>Cross-product magnitude as parallelogram area</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="34" class="title" text-anchor="start">Cross product and parallelogram area</text><path d="M110 425l150 -250l370 0l-150 250Z" class="" fill="#e2edf1" stroke="#285e75" stroke-width="2"/><path d="M110 425L260 175" class="flow" /><text x="158.0" y="300.0" class="" text-anchor="start">a⃗</text><path d="M110 425L480 425" class="flow" /><text x="295.0" y="459.0" class="" text-anchor="start">b⃗</text><path d="M260 175L630 175" class="flow" /><text x="445.0" y="160.0" class="" text-anchor="start">b⃗</text><path d="M480 425L630 175" class="flow" /><text x="570.0" y="300.0" class="" text-anchor="start">a⃗</text><path d="M155.00 425.00L154.99 423.84L154.94 422.68L154.87 421.53L154.76 420.37L154.63 419.22L154.46 418.07L154.27 416.93L154.05 415.79L153.80 414.66L153.52 413.54L153.21 412.42L152.87 411.31L152.50 410.21L152.11 409.12L151.68 408.04L151.23 406.97L150.75 405.92L150.25 404.87L149.72 403.84L149.16 402.83L148.57 401.83L147.97 400.84L147.33 399.87L146.67 398.92L145.99 397.98L145.28 397.06L144.55 396.17L143.79 395.28L143.02 394.42L142.22 393.58L141.40 392.76L140.56 391.97L139.70 391.19L138.82 390.44L137.92 389.71L137.00 389.00L136.06 388.32L135.11 387.66L134.14 387.02L133.15 386.41" class="" fill="none" stroke="#285e75" stroke-width="2.5" stroke-dasharray=""/><text x="164.82259412546915" y="398.95997465603364" class="" text-anchor="middle">θ</text><path d="M260 175L260 425" class="line dash" /><path d="M260 412h13v13" class="line" /><text x="280" y="243" class="" text-anchor="start">|a⃗| sin θ</text><path d="M480 425L207.94117647058823 261.7647058823529" class="line dash" /><text x="340" y="294" class="" text-anchor="start">|b⃗| sin θ</text><text x="758" y="186" class="" text-anchor="start">Area = |a⃗| |b⃗| sin θ</text><text x="758" y="244" class="" text-anchor="start">|a⃗ × b⃗| = area</text><text x="758" y="312" class="" text-anchor="start">⊗  a⃗ × b⃗ into page</text><text x="758" y="339" class="small" text-anchor="start">for this ordering</text><text x="758" y="405" class="" text-anchor="start">Swapping the vectors</text><text x="758" y="432" class="small" text-anchor="start">reverses the normal.</text><text x="30" y="548" class="small" text-anchor="start">The two dashed perpendicular heights give the same area using either side as the base.</text></svg>