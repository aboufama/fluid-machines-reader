<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 670" role="img"><title>Torque converter flow and mechanical connections</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="540" y="35" class="title" text-anchor="middle">Torque converter during acceleration</text><text x="540" y="64" class="small" text-anchor="middle">Functional exploded schematic</text><path d="M138 439V229Q139 149 229 149H825Q901 149 906 229V439" class="wall" /><text x="178" y="129" class="small" text-anchor="start">Casing fixed to flex plate, crankshaft and engine</text><path d="M283 218Q204 310 283 409 M343 218Q417 310 343 409" class="" fill="none" stroke="#bb7d31" stroke-width="12"/><path d="M265 248Q313 224 361 248" class="" fill="none" stroke="#bb7d31" stroke-width="3"/><path d="M265 282Q313 258 361 282" class="" fill="none" stroke="#bb7d31" stroke-width="3"/><path d="M265 316Q313 292 361 316" class="" fill="none" stroke="#bb7d31" stroke-width="3"/><path d="M265 350Q313 326 361 350" class="" fill="none" stroke="#bb7d31" stroke-width="3"/><path d="M265 384Q313 360 361 384" class="" fill="none" stroke="#bb7d31" stroke-width="3"/><text x="313" y="459" class="title" text-anchor="middle">Turbine</text><path d="M707 218Q628 310 707 409 M767 218Q841 310 767 409" class="" fill="none" stroke="#367c93" stroke-width="12"/><path d="M689 248Q737 224 785 248" class="" fill="none" stroke="#367c93" stroke-width="3"/><path d="M689 282Q737 258 785 282" class="" fill="none" stroke="#367c93" stroke-width="3"/><path d="M689 316Q737 292 785 316" class="" fill="none" stroke="#367c93" stroke-width="3"/><path d="M689 350Q737 326 785 350" class="" fill="none" stroke="#367c93" stroke-width="3"/><path d="M689 384Q737 360 785 384" class="" fill="none" stroke="#367c93" stroke-width="3"/><text x="737" y="459" class="title" text-anchor="middle">Impeller</text><rect x="345" y="343" width="639" height="22" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><rect x="35" y="343" width="156" height="22" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><path d="M179 343V437H276 M768 437H906" class="wall" /><text x="27" y="326" class="small" text-anchor="start">Engine shaft</text><text x="786" y="398" class="small" text-anchor="start">Transmission input shaft</text><path d="M941 385L941 365" class="line" /><path d="M477 311Q525 278 573 311L573 361Q525 395 477 361Z" class="wall" style="fill:#e7e2f1"/><text x="525" y="413" class="title" text-anchor="middle">Stator</text><path d="M525 386L525 399" class="line" /><path d="M709 211Q528 165 337 211" class="flow" /><text x="525" y="95" class="small" text-anchor="middle">Outer flow: high angular momentum, fast → slow</text><path d="M519 103L519 177" class="line" /><path d="M369 312H466 M583 312H680" class="flow" /><text x="524" y="267" class="small" text-anchor="middle">Inner return: low angular momentum</text><text x="524" y="290" class="small" text-anchor="middle">slow → fast</text><path d="M214 258Q245 228 250 269" class="flow" /><path d="M832 258Q863 228 868 269" class="flow" /><text x="202" y="205" class="small" text-anchor="start">Slower</text><text x="827" y="205" class="small" text-anchor="start">Faster</text><text x="45" y="519" class="small" text-anchor="start">Turbine spins freely in the casing; its hub drives the transmission input shaft.</text><text x="45" y="549" class="small" text-anchor="start">Impeller is fixed to the casing and rotates with the engine.</text><text x="45" y="579" class="small" text-anchor="start">Stator redirects return flow when impeller speed greatly exceeds turbine speed.</text><text x="45" y="609" class="small" text-anchor="start">At gentle acceleration or deceleration, the stator freewheels.</text></svg>