<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img"><title>Carburetor and Venturi principle</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="160" y="35" class="title" text-anchor="middle">Lawnmower carburetor</text><text x="715" y="35" class="title" text-anchor="middle">Venturi schematic</text><rect x="88" y="130" width="130" height="120" fill="#e4edf0" stroke="#285e75" stroke-width="2"/><path d="M88 142H51V209H88 M218 141H258V209H218" class="wall" /><path d="M107 251V317Q155 344 201 317V251" class="wall" /><rect x="118" y="99" width="75" height="32" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><circle cx="150.00" cy="181.00" r="37" fill="#97b7c4"/><circle cx="150.00" cy="181.00" r="28" fill="white"/><path d="M125 159L175 203" class="wall" /><text x="153" y="374" class="small" text-anchor="middle">Simplified exterior</text><path d="M396 123H504C557 123 570 173 629 173H682C737 173 756 123 815 123H1011 M396 267H504C557 267 570 217 629 217H649 M665 217H682C737 217 756 267 815 267H1011" class="wall" /><path d="M350 195L436 195" class="flow" /><text x="361" y="178" class="small" text-anchor="start">Air</text><path d="M475 195L516 195" class="wall" /><text x="470" y="96" class="small" text-anchor="start">Choke</text><path d="M497 104L498 189" class="line" /><path d="M864 147L913 242" class="wall" /><text x="867" y="96" class="small" text-anchor="start">Throttle</text><path d="M897 102L887 184" class="line" /><path d="M984 195L1065 195" class="flow" /><text x="939" y="304" class="small" text-anchor="start">To intake manifold</text><text x="524" y="170" class="" text-anchor="start">A₁</text><text x="641" y="155" class="" text-anchor="start">A₂</text><path d="M649 218V315H579V360H734V315H665V218" class="wall" /><rect x="581" y="331" width="150" height="27" fill="#d6edf2" stroke="#285e75" stroke-width="2"/><rect x="683" y="317" width="37" height="19" fill="#fff1cf" stroke="#285e75" stroke-width="2"/><path d="M682 322L668 309L658 309" class="wall" /><path d="M660 305L660 252" class="flow" /><text x="774" y="358" class="small" text-anchor="start">Fuel reservoir and float</text><path d="M765 347L721 328" class="line" /><text x="35" y="439" class="title" text-anchor="start">DETAILS LOST IN THIS SCHEMATIC</text><text x="35" y="473" class="" text-anchor="start">• Fuel–air mixture screws</text><text x="35" y="503" class="" text-anchor="start">• Carb slide, spring, vacuum port (for some carbs)</text><text x="35" y="533" class="" text-anchor="start">• Fuel needle (some carbs)</text><text x="35" y="563" class="" text-anchor="start">• Other fancy stuff</text><text x="615" y="439" class="title" text-anchor="start">NOT IN A REAL CARBURETOR</text><text x="615" y="473" class="" text-anchor="start">• Choke (often replaced with something fancier)</text><text x="615" y="503" class="" text-anchor="start">• Fore–aft symmetry (never in real carb;</text><text x="633" y="533" class="" text-anchor="start">in every textbook schematic though)</text><text x="550" y="654" class="small" text-anchor="middle">Source schematic and handwritten qualifications, redrawn without numerical dimensions.</text></svg>