<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 510" role="img"><title>Cartesian coordinates and unit vectors</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="425" y="33" class="title" text-anchor="middle">Cartesian coordinates</text><path d="M310 300L475.0 300.0" class="flow" /><text x="497.0" y="313.2" class="small" text-anchor="start">x</text><path d="M310 300L310.0 112.99999999999997" class="flow" /><text x="332.0" y="126.19999999999999" class="small" text-anchor="start">y</text><path d="M310 300L189.0 396.8" class="flow" /><text x="211.0" y="410.0" class="small" text-anchor="start">z</text><text x="670" y="99" class="" text-anchor="middle">Unit vectors</text><path d="M622 191L700 191" class="flow" /><text x="720" y="197" class="" text-anchor="start">x̂</text><path d="M651 330L651 251" class="flow" /><text x="675" y="284" class="" text-anchor="start">ŷ</text><path d="M718 385L656 447" class="flow" /><text x="735" y="402" class="" text-anchor="start">ẑ</text></svg>