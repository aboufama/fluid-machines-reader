<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" role="img"><title>Hydraulic jack pressure and force diagram</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><path d="M130 205H390V253H300V335H677V205H705V360H260V253H130Z" class="wall" style="fill:#d8eaf1"/><path d="M250 203L250 129" class="flow" /><path d="M691 124L691 200" class="flow" /><text x="174" y="106" class="" text-anchor="start">RAM • area A₂</text><text x="619" y="101" class="" text-anchor="start">PISTON • area A₁</text><text x="164" y="175" class="" text-anchor="start">F₂ = p₂A₂</text><text x="712" y="151" class="" text-anchor="start">F₁ = p₁A₁</text><text x="355" y="292" class="small" text-anchor="start">p approximately uniform</text><text x="387" y="317" class="small" text-anchor="start">because p ≫ ρgΔz</text><text x="485" y="353" class="small" text-anchor="start">OIL</text><text x="83" y="310" class="" text-anchor="start">p₂ ≈ p₁</text><path d="M166 303L191 250" class="line" /><text x="725" y="284" class="small" text-anchor="start">p₁ = F₁/A₁</text><text x="150" y="45" class="title" text-anchor="start">F₂ = p₂A₂ = F₁ A₂/A₁  •  mechanical advantage</text></svg>