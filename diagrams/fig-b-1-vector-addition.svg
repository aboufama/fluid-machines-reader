<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img"><title>Geometric vector addition in either order</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="32" class="title" text-anchor="start">Head-to-tail vector addition</text><path d="M50 250L110 120" class="flow" /><text x="53.0" y="185.0" class="" text-anchor="start">a⃗</text><path d="M150 250L280 205" class="flow" /><text x="215.0" y="213.5" class="" text-anchor="start">b⃗</text><path d="M350 250L410 120" class="flow" /><text x="353.0" y="185.0" class="" text-anchor="start">a⃗</text><path d="M410 120L540 75" class="flow" /><text x="475.0" y="83.5" class="" text-anchor="start">b⃗</text><path d="M350 250L540 75" class="flow" /><text x="451.0" y="182.5" class="" text-anchor="start">a⃗ + b⃗</text><path d="M680 250L810 205" class="flow" /><text x="745.0" y="253.5" class="" text-anchor="start">b⃗</text><path d="M810 205L870 75" class="flow" /><text x="852.0" y="140.0" class="" text-anchor="start">a⃗</text><path d="M680 250L870 75" class="flow" /><text x="710.0" y="150.5" class="" text-anchor="start">b⃗ + a⃗</text><text x="170" y="310" class="" text-anchor="middle">Starting vectors</text><text x="447" y="310" class="" text-anchor="middle">a⃗ then b⃗</text><text x="780" y="310" class="" text-anchor="middle">b⃗ then a⃗</text></svg>