<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" role="img"><title>Streamwise control volume with pressure forces and gravity</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="25" y="32" class="title" text-anchor="start">Streamwise momentum balance with gravity</text><rect x="330" y="120" width="150" height="135" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><path d="M330 120L380 85L530 85L480 120M480 120L530 85L530 220L480 255" class="wall" /><path d="M330 255L380 220L530 220M380 220L380 85" class="line dash" /><path d="M330 60L480 60" class="dim" /><text x="405.0" y="51" class="" text-anchor="middle">Δs</text><path d="M555 120L555 255" class="dim" /><text x="564" y="159.5" class="" text-anchor="start">Δn</text><path d="M490 275L540 240" class="dim" /><text x="532" y="273" class="" text-anchor="start">Δℓ</text><path d="M225 183L350 183" class="flow" /><path d="M460 183L580 183" class="flow" /><text x="28" y="128" class="" text-anchor="start">Left face</text><text x="28" y="155" class="small" text-anchor="start">F<tspan baseline-shift="sub" font-size=".75em">s</tspan> = (p − (∂p/∂s) Δs/2) Δn Δℓ</text><text x="590" y="209" class="" text-anchor="start">Right face</text><text x="590" y="235" class="small" text-anchor="start">F<tspan baseline-shift="sub" font-size=".75em">s</tspan> = −(p + (∂p/∂s) Δs/2) Δn Δℓ</text><path d="M730 102L800 102" class="flow" /><text x="806" y="107" class="" text-anchor="start">s</text><path d="M730 102L730 42" class="flow" /><text x="736" y="47" class="" text-anchor="start">n</text><path d="M730 102L689 132" class="flow" /><text x="679" y="147" class="" text-anchor="start">ℓ</text><path d="M730 102L790 139" class="line dash" /><text x="798" y="148" class="" text-anchor="start">x</text><path d="M730 102L763 47" class="line dash" /><text x="772" y="50" class="" text-anchor="start">z</text><path d="M769 102Q770 112 764 123" class="line" /><text x="778" y="124" class="small" text-anchor="start">θ</text><path d="M405 190L350 305" class="flow" /><text x="65" y="316" class="" text-anchor="start">Gravity: F<tspan baseline-shift="sub" font-size=".75em">z</tspan> = −ρg Δs Δn Δℓ</text><text x="65" y="346" class="" text-anchor="start">Streamwise component: F<tspan baseline-shift="sub" font-size=".75em">s</tspan> = −ρg Δs Δn Δℓ sin θ</text><text x="30" y="397" class="" text-anchor="start">m = ρ Δs Δn Δℓ</text><text x="30" y="428" class="small" text-anchor="start">Pressure arrows show the positive reference direction; the signed labels specify the force.</text><text x="30" y="456" class="small" text-anchor="start">The source derivation and its acceleration-notation correction are transcribed below.</text></svg>