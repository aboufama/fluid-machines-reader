"start">Δz</text><path d="M823 629L920 629" class="flow" /><text x="934" y="635" class="" text-anchor="start">x</text><path d="M823 629L823 544" class="flow" /><text x="814" y="529" class="" text-anchor="start">y</text><path d="M823 629L758 679" class="flow" /><text x="741" y="696" class="" text-anchor="start">z</text><text x="30" y="746" class="small" text-anchor="start">Signed mass fluxes on all six faces are typeset below.</text></svg>