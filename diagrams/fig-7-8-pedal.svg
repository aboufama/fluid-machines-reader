<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1000" role="img"><title>Antitorque pedal: increased tail-rotor pitch</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="35" class="title" text-anchor="start">Antitorque pedal: increased tail-rotor pitch</text><text x="35" y="88" class="" text-anchor="start">A · Pilot input</text><rect x="40" y="120" width="310" height="150" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><rect x="95" y="150" width="60" height="90" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><rect x="230" y="165" width="60" height="90" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><path d="M126 161L126 123" class="flow" /><text x="55" y="302" class="" text-anchor="start">Press left foot pedal forward.</text><path d="M375 195L470 195" class="flow" /><text x="490" y="170" class="" text-anchor="start">Control signal sets blade pitch</text><text x="490" y="200" class="" text-anchor="start">through the swash plate (source label).</text><text x="35" y="363" class="" text-anchor="start">B · Resulting blade pitch</text><path d="M391 490A96 96 0 1 1 199 490A96 96 0 1 1 391 490" class="line" /><path d="M199 490L391 490" class="line" /><path d="M295 394L295 586" class="line" /><text x="295" y="377" class="small" text-anchor="middle">Fore 90°</text><text x="295" y="611" class="small" text-anchor="middle">Aft 270°</text><text x="189" y="480" class="small" text-anchor="end">180° left</text><text x="401" y="480" class="small" text-anchor="start">0° right</text><path d="M354 480Q347 436 305 431" class="flow" /><text x="295" y="638" class="small" text-anchor="middle">Rotor-blade path (top view)</text><path d="M630 395V555H970" class="wall" /><text x="620" y="377" class="" text-anchor="start">Pitch angle α</text><text x="978" y="560" class="" text-anchor="start">θ</text><text x="630" y="580" class="small" text-anchor="middle">0°</text><text x="710" y="580" class="small" text-anchor="middle">90°</text><text x="790" y="580" class="small" text-anchor="middle">180°</text><text x="870" y="580" class="small" text-anchor="middle">270°</text><text x="950" y="580" class="small" text-anchor="middle">360°</text><path d="M630 480L950 480" class="line dash" /><text x="951" y="476" class="small" text-anchor="start">Trim</text><path d="M630 425L950 425" class="line" /><text x="655" y="414" class="small" text-anchor="start">Higher pitch throughout</text><text x="35" y="700" class="" text-anchor="start">C · Resulting motion</text><g transform="translate(255 825) scale(0.5)"><path d="M0 -115C-54 -100 -49 35 -20 60L-8 210H8L20 60C49 35 54 -100 0 -115Z" class="wall" /><path d="M-150 25L145 -35M-145 15L150 -45" class="wall" /><circle cx="0.00" cy="0.00" r="8" fill="#285e75"/><path d="M-28 175H28M-13 165V214" class="wall" /></g><path d="M366 850Q390 781 305 757" class="flow" /><path d="M255 930L373 930" class="flow" /><path d="M230 930L118 930" class="flow" /><text x="450" y="790" class="" text-anchor="start">Increased tail thrust gives counterclockwise yaw.</text><text x="450" y="826" class="small" text-anchor="start">Corrected direction; the source caption contradicts itself.</text><text x="450" y="870" class="small" text-anchor="start">Thrust →    Downwash ←</text><text x="30" y="983" class="small" text-anchor="start">Schematic redrawing of the source’s A → B → C control sequence.</text></svg>