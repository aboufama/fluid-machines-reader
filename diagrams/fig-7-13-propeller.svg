w" /><path d="M802 251L860 251" class="flow" /><path d="M802 270L860 270" class="flow" /><path d="M802 289L860 289" class="flow" /><path d="M802 308L860 308" class="flow" /><text x="50" y="555" class="" text-anchor="start">Inlet mass-flow magnitude: ρU₁A₁</text><text x="550" y="555" class="" text-anchor="start">Outlet mass flow: ρU₂A₂</text><text x="30" y="596" class="small" text-anchor="start">Momentum-flux annotations are typeset with the solution below.</text></svg>