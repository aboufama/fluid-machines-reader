<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 870" role="img"><title>Streamfunction flux across a path and flow over a backward-facing step</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="35" class="title" text-anchor="start">Streamfunction and areal flow</text><text x="35" y="89" class="" text-anchor="start">A · Flux across a differential path</text><path d="M80 500Q175 350 427 198" class="line" /><path d="M80 500H427V198H80Z" class="line dash" /><circle cx="80.00" cy="500.00" r="4" fill="#285e75"/><circle cx="427.00" cy="198.00" r="4" fill="#285e75"/><text x="52" y="532" class="small" text-anchor="start">Toward O</text><text x="432" y="178" class="small" text-anchor="start">Toward A</text><path d="M80 553L427 553" class="dim" /><text x="250" y="578" class="" text-anchor="start">dx</text><path d="M477 500L477 198" class="dim" /><text x="490" y="365" class="" text-anchor="start">dy</text><path d="M217 319L252 369" class="flow" /><text x="251" y="393" class="small" text-anchor="start">n̂ ds</text><text x="251" y="420" class="small" text-anchor="start">u dy − v dx</text><path d="M18 385L72 385" class="flow" /><text x="25" y="354" class="" text-anchor="start">u dy</text><path d="M383 354L441 354" class="flow" /><text x="389" y="385" class="" text-anchor="start">u dy</text><path d="M223 147L223 202" class="flow" /><text x="165" y="130" class="" text-anchor="start">−v dx</text><path d="M245 459L245 515" class="flow" /><text x="262" y="496" class="" text-anchor="start">−v dx</text><text x="600" y="89" class="" text-anchor="start">B · Flow over a backward-facing step</text><path d="M615 155H1100M615 300H708V542H1100" class="wall" /><path d="M615 176H680C780 176 830 185 1000 185H1100" class="line" /><text x="1110" y="191" class="small" text-anchor="start">ψ = 2</text><path d="M570 176L611 176" class="flow" /><path d="M615 195H680C780 195 830 234 1000 234H1100" class="line" /><text x="1110" y="240" class="small" text-anchor="start">ψ = 1</text><path d="M570 195L611 195" class="flow" /><path d="M615 214H680C780 214 830 283 1000 283H1100" class="line" /><text x="1110" y="289" class="small" text-anchor="start">ψ = 0</text><path d="M570 214L611 214" class="flow" /><path d="M615 233H680C780 233 830 332 1000 332H1100" class="line" /><text x="1110" y="338" class="small" text-anchor="start">ψ = -1</text><path d="M570 233L611 233" class="flow" /><path d="M615 252H680C780 252 830 381 1000 381H1100" class="line" /><text x="1110" y="387" class="small" text-anchor="start">ψ = -2</text><path d="M570 252L611 252" class="flow" /><path d="M615 271H680C780 271 830 430 1000 430H1100" class="line" /><text x="1110" y="436" class="small" text-anchor="start">ψ = -3</text><path d="M570 271L611 271" class="flow" /><path d="M708 300Q798 302 912 541" class="line" /><text x="891" y="506" class="small" text-anchor="start">ψ = −4</text><path d="M733 370C800 370 875 485 842 500C765 493 721 424 733 370Z" class="line" /><path d="M758 395C790 385 843 451 815 463C781 463 744 428 758 395Z" class="line" /><text x="755" y="442" class="small" text-anchor="start">ψ = −6</text><text x="771" y="520" class="small" text-anchor="start">ψ = −5</text><text x="582" y="340" class="small" text-anchor="end">Inlet</text><text x="582" y="363" class="small" text-anchor="end">flow</text><text x="1055" y="136" class="small" text-anchor="start">Outlet</text><text x="946" y="585" class="small" text-anchor="start">Farther apart: U small</text><text x="615" y="642" class="" text-anchor="start">ψ is constant along a streamline.</text><text x="615" y="685" class="" text-anchor="start">For a streamline joining A and B:</text><text x="685" y="724" class="" text-anchor="start">ψ(A) = ψ(B)</text><text x="30" y="816" class="small" text-anchor="start">Schematic curves retain the source’s legible contour values; they are not computed flow data.</text></svg>