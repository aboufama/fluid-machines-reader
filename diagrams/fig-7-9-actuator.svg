<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 950" role="img"><title>Actuator disk control surfaces, with corrected pressure-jump relation</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="35" class="title" text-anchor="start">Actuator-disk model · corrected pressure jump</text><path d="M75.0 385.0A275.0 275.0 0 0 1 625.0 385.0C430 385.0 405 405.0 395 425.0L380 765H320L305 425.0C295 405.0 270 385.0 75.0 385.0Z" class="line" /><rect x="305" y="417.0" width="90" height="16" fill="#d4e2e8" stroke="#285e75" stroke-width="2"/><path d="M350 100L350 800" class="line dash" /><path d="M615.6296022294938 313.8247625968068L594.3792340511343 319.51878158906226" class="flow" /><path d="M560.6622218577189 208.2334073362017L543.8092441091014 222.37473474930556" class="flow" /><path d="M466.22002197869233 135.76535856492126L456.92242022039693 155.70412987972756" class="flow" /><path d="M350.0 110.0L350.0 132.0" class="flow" /><path d="M233.77997802130767 135.76535856492123L243.07757977960307 155.70412987972753" class="flow" /><path d="M139.33777814228108 208.23340733620165L156.1907558908986 222.37473474930553" class="flow" /><path d="M84.37039777050626 313.82476259680675L105.62076594886577 319.5187815890622" class="flow" /><path d="M328 765L328 809" class="flow" /><path d="M343 765L343 809" class="flow" /><path d="M357 765L357 809" class="flow" /><path d="M372 765L372 809" class="flow" /><text x="350" y="80" class="" text-anchor="middle">S₁ · far upstream</text><text x="665" y="112" class="" text-anchor="start">S₁: mass flux, negligible momentum flux</text><text x="665" y="145" class="small" text-anchor="start">U₁ → 0 as A₁ → ∞</text><text x="665" y="202" class="" text-anchor="start">Ambient pressure far upstream</text><text x="665" y="231" class="small" text-anchor="start">and at downstream surface S₄.</text><text x="665" y="310" class="" text-anchor="start">S₂: immediately above the disk</text><text x="665" y="341" class="" text-anchor="start">S₃: immediately below the disk</text><text x="665" y="389" class="" text-anchor="start">S₅ and S₆ follow streamlines:</text><text x="665" y="420" class="small" text-anchor="start">no mass or momentum crosses them.</text><text x="350" y="399.0" class="" text-anchor="middle">S₂</text><text x="350" y="473.0" class="" text-anchor="middle">S₃</text><text x="420" y="433.0" class="" text-anchor="start">Actuator disk</text><path d="M421 438.0L393 425.0" class="line" /><text x="225" y="605" class="" text-anchor="start">S₅</text><path d="M250 597L315 637" class="line" /><text x="447" y="605" class="" text-anchor="start">S₆</text><path d="M440 597L385 637" class="line" /><text x="411" y="780" class="" text-anchor="start">S₄ · wake</text><text x="665" y="525" class="" text-anchor="start">Lift on rotor ↑</text><path d="M740 665L740 555" class="flow" /><text x="665" y="708" class="" text-anchor="start">Pressure rises across the disk.</text><text x="665" y="738" class="" text-anchor="start">Velocity is continuous there.</text><text x="30" y="872" class="small" text-anchor="start">Station properties and the original pressure typo are typeset below.</text><text x="30" y="915" class="small" text-anchor="start">Schematic geometry; control surfaces and arrows follow the source.</text></svg>