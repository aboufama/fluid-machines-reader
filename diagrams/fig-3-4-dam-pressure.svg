<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 810" role="img"><title>A dam localizes the release of gravitational potential energy</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="530" y="34" class="title" text-anchor="middle">How a dam concentrates hydroelectric generation</text><text x="530" y="87" class="" text-anchor="middle">River without a dam</text><path d="M80 138L195 157L335 196L451 212L614 258L760 294L958 346L958 369L765 321L613 281L446 237L331 218L194 181L80 159Z" class="" fill="#dceff5" stroke="none"/><path d="M80 159L194 181L331 218L446 237L613 281L765 321L958 369" class="wall" /><path d="M121 155L197 175" class="flow" /><path d="M374 217L450 237" class="flow" /><path d="M705 292L781 312" class="flow" /><path d="M862 333L938 353" class="flow" /><text x="131" y="243" class="small" text-anchor="start">Riverbed</text><text x="891" y="314" class="small" text-anchor="start">River</text><text x="530" y="419" class="" text-anchor="middle">River with a dam</text><path d="M80 506H736L704 690L80 578Z" class="" fill="#dceff5" stroke="none"/><path d="M80 578L223 608L351 623L497 651L671 680L956 751" class="wall" /><path d="M80 506L736 506" class="line" /><path d="M712 697L750 466H772L835 722Z" class="" fill="#bac8cf" stroke="#526878" stroke-width="3"/><text x="771" y="593" class="" text-anchor="middle">Dam</text><text x="301" y="552" class="" text-anchor="middle">Impoundment</text><text x="301" y="579" class="small" text-anchor="middle">Lake / reservoir</text><text x="90" y="665" class="small" text-anchor="start">Riverbed</text><path d="M603 506L603 680" class="line" /><text x="548" y="469" class="" text-anchor="middle">p(d) = p<tspan baseline-shift="sub" font-size=".75em">atm</tspan> + ρgd</text><path d="M603 510L616 510" class="flow" /><path d="M603 533L627 533" class="flow" /><path d="M603 556L638 556" class="flow" /><path d="M603 579L649 579" class="flow" /><path d="M603 602L660 602" class="flow" /><path d="M603 625L671 625" class="flow" /><path d="M603 648L682 648" class="flow" /><path d="M603 671L693 671" class="flow" /><text x="473" y="746" class="small" text-anchor="middle">Pressure increases with depth.</text><path d="M679 687L845 732L954 759" class="" fill="none" stroke="#285e75" stroke-width="9"/><circle cx="846.00" cy="727.00" r="20" fill="#e1c8a0"/><text x="905" y="584" class="small" text-anchor="middle">Hydroelectric</text><text x="905" y="608" class="small" text-anchor="middle">turbine</text><path d="M893 622L851 701" class="flow" /><path d="M875 744L969 768" class="flow" /><text x="977" y="723" class="small" text-anchor="middle">River</text></svg>