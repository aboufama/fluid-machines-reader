<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 730" role="img"><title>Helicopter yaw equilibrium viewed from above</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="35" class="title" text-anchor="start">Yaw equilibrium · viewed from above</text><g transform="translate(390 315) scale(1.25)"><path d="M0 -115C-54 -100 -49 35 -20 60L-8 210H8L20 60C49 35 54 -100 0 -115Z" class="wall" /><path d="M-150 25L145 -35M-145 15L150 -45" class="wall" /><circle cx="0.00" cy="0.00" r="8" fill="#285e75"/><path d="M-28 175H28M-13 165V214" class="wall" /></g><path d="M620 315A230 230 0 1 1 160 315A230 230 0 1 1 620 315" class="line dash" /><path d="M548 372A170 170 0 0 0 548 250" class="flow" /><text x="55" y="85" class="" text-anchor="start">Main rotor turns CCW</text><text x="55" y="110" class="" text-anchor="start">Motor torque on rotor: CCW</text><path d="M663 310Q705 355 660 400" class="flow" /><text x="711" y="337" class="" text-anchor="start">Fuselage reaction</text><text x="711" y="365" class="" text-anchor="start">torque: clockwise</text><path d="M666 265Q705 225 665 180" class="flow" /><text x="711" y="148" class="" text-anchor="start">Tail-rotor yaw</text><text x="711" y="176" class="" text-anchor="start">torque: CCW</text><path d="M358 561L227 561" class="flow" /><path d="M409 561L538 561" class="flow" /><text x="90" y="610" class="" text-anchor="start">Tail-rotor downwash ←</text><text x="430" y="610" class="" text-anchor="start">Tail-rotor thrust →</text><text x="30" y="685" class="small" text-anchor="start">The two torques on the fuselage cancel in longitudinal trim.</text></svg>