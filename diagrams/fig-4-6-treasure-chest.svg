<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 450" role="img"><title>Treasure chest with half cylindrical lid</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><path d="M55 60L815 60" class="line" /><text x="74" y="42" class="" text-anchor="start">Water surface</text><path d="M275 300V390H435V300A80 80 0 0 0 275 300Z" class="wall" /><path d="M275 300L435 300" class="line" /><path d="M125 60L125 300" class="dim" /><text x="140" y="180" class="" text-anchor="start">d = 10 m</text><path d="M275 416L435 416" class="dim" /><text x="309" y="442" class="" text-anchor="start">b = 18 in</text><path d="M241 300L241 390" class="dim" /><text x="145" y="359" class="" text-anchor="start">a = 12 in</text><path d="M355 300L402 300" class="flow" /><path d="M355 300L355 253" class="flow" /><text x="406" y="322" class="" text-anchor="start">x</text><text x="367" y="260" class="" text-anchor="start">z</text><text x="308" y="195" class="small" text-anchor="start">r = b/2 = 9 in</text><path d="M560 250V330H650V250A45 45 0 0 0 560 250ZM605 205L715 125A45 45 0 0 1 760 170L650 250M650 330L760 250V170" class="wall" /><path d="M650 250L760 170" class="line" /><path d="M660 354L774 271" class="dim" /><text x="698" y="333" class="" text-anchor="start">c = 36 in</text><text x="542" y="392" class="small" text-anchor="start">Half-cylinder lid, length c</text></svg>