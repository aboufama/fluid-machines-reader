<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 630" role="img"><title>Control-volume momentum balance for jet impingement</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="35" class="title" text-anchor="start">Jet impinging on a plate: control volume</text><rect x="535" y="134" width="17" height="370" fill="#d4e2e8" stroke="#285e75" stroke-width="2"/><path d="M352 226H535V421H352Z" class="line dash" /><path d="M144 296H442Q520 296 520 230V135M144 339H442Q520 339 520 405V508" class="line" /><path d="M243 318L365 318" class="flow" /><text x="219" y="280" class="" text-anchor="start">u</text><path d="M182 297L182 338" class="dim" /><text x="151" y="377" class="" text-anchor="start">d</text><path d="M520 227L520 140" class="flow" /><path d="M520 409L520 511" class="flow" /><path d="M661 317L557 317" class="flow" /><text x="641" y="280" class="" text-anchor="start">Force on fluid: −x direction</text><text x="53" y="127" class="" text-anchor="start">Inlet x-momentum outflux</text><text x="75" y="160" class="" text-anchor="start">−ρu²A</text><text x="631" y="429" class="" text-anchor="start">Upper and lower outlets:</text><text x="631" y="460" class="" text-anchor="start">zero x-momentum flux</text><text x="315" y="567" class="" text-anchor="start">Control surface (dashed)</text><text x="30" y="608" class="small" text-anchor="start">The source diagram has the inlet at left; the prose “entering at right” is erroneous.</text></svg>