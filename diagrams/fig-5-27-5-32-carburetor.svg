<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 685" role="img" aria-labelledby="title desc"><title id="title">Carburetor geometry</title><desc id="desc">Air flows left to right past a choke, a venturi with area A2 supplied by fuel from the float-feed chamber, and a throttle. Upstream area is A1. Redrawn essential flow schematic shared by Figures 5.27 and 5.32. Decorative perspective drawing omitted.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:19px;fill:#172e3c}.small{font-size:16px}.math{font-family:Georgia,serif;font-style:italic;font-size:22px}.wall{fill:none;stroke:#172e3c;stroke-width:3;stroke-linejoin:round}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#arrow)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#arrow);marker-end:url(#arrow)}.water{fill:#e7f3f7;stroke:none}.dash{stroke-dasharray:7 6}</style><rect width="100%" height="100%" fill="white"/><text x="450" y="38" class="" text-anchor="middle">Simplified carburetor schematic</text><path d="M155 125H365Q430 190 495 125H690M155 275H365Q430 210 495 275H690" class="wall"/><path d="M60 200L130 200" class="flow"/><text x="65" y="180" class="" text-anchor="start">Air</text><path d="M715 200L790 200" class="flow"/><text x="720" y="237" class="" text-anchor="start">To intake</text><text x="720" y="262" class="" text-anchor="start">manifold</text><path d="M215 200L295 200" class="wall"/><circle cx="255" cy="200" r="5" fill="white" stroke="#172e3c" stroke-width="2"/><text x="217" y="100" class="" text-anchor="start">Choke</text><text x="248" y="177" class="math" text-anchor="start">A₁</text><path d="M570 172L638 228" class="wall"/><circle cx="604" cy="200" r="5" fill="white" stroke="#172e3c" stroke-width="2"/><text x="567" y="100" class="" text-anchor="start">Throttle</text><text x="423" y="199" class="math" text-anchor="start">A₂</text><path d="M320 275V410H540V275" class="wall"/><path d="M323 366H538V407H323Z" class="water"/><rect x="332" y="303" width="197" height="61" fill="white" stroke="#172e3c" stroke-width="2"/><path d="M425 232V388M437 232V388" class="line dash"/><text x="466" y="340" class="" text-anchor="start">Float</text><text x="461" y="395" class="" text-anchor="start">Fuel</text><text x="565" y="330" class="" text-anchor="start">Float-feed</text><text x="565" y="355" class="" text-anchor="start">chamber</text><text x="205" y="311" class="" text-anchor="start">Venturi</text><path d="M276 307L409 222" class="flow"/><text x="35" y="465" class="" text-anchor="start">Details lost in this schematic:</text><text x="35" y="494" class="small" text-anchor="start">• Fuel-air mixture screws</text><text x="35" y="520" class="small" text-anchor="start">• Carb slide, spring, vacuum port (for some carbs)</text><text x="35" y="546" class="small" text-anchor="start">• Fuel needle (some carbs); other fancy stuff</text><text x="35" y="592" class="" text-anchor="start">Stuff in this schematic that isn&#x27;t in a real carburetor:</text><text x="35" y="621" class="small" text-anchor="start">• Choke (often replaced with something fancy)</text><text x="35" y="647" class="small" text-anchor="start">• Fore-aft symmetry (never in real carb, in every textbook schematic though)</text></svg>