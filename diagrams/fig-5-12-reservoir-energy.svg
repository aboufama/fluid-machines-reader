<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 665" role="img"><title>Reservoir free jet and exchange of volumetric energy</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="275" y="34" class="title" text-anchor="middle">Reservoir and free jet</text><text x="902" y="34" class="title" text-anchor="middle">Energy along the streamline</text><path d="M72 98V419H474 M474 98V388Q474 409 499 409H551" class="wall" /><path d="M75 141H471V388Q471 412 497 412H551V419H75Z" class="" fill="#e5f3f7"/><path d="M73 141L471 141" class="line" /><text x="222" y="118" class="" text-anchor="start">p<tspan baseline-shift="sub" font-size=".75em">atm</tspan></text><path d="M38 142L38 417" class="dim" /><text x="19" y="284" class="" text-anchor="start">h</text><path d="M74 456L473 456" class="dim" /><text x="277" y="483" class="" text-anchor="start">R</text><text x="479" y="89" class="small" text-anchor="start">r ≪ R</text><text x="479" y="114" class="small" text-anchor="start">r ≪ h</text><path d="M516 249L516 176" class="flow" /><text x="505" y="168" class="" text-anchor="start">z</text><path d="M548 177L548 250" class="flow" /><text x="551" y="270" class="small" text-anchor="start">g ↓</text><path d="M88 147V400H541" class="line dash" /><path d="M184 312Q331 306 474 406" class="line" /><path d="M252 235Q399 269 488 408" class="line" /><text x="95" y="150" class="small" text-anchor="start">A</text><text x="95" y="277" class="small" text-anchor="start">B</text><text x="95" y="401" class="small" text-anchor="start">C</text><text x="239" y="401" class="small" text-anchor="start">D</text><text x="335" y="401" class="small" text-anchor="start">E</text><text x="410" y="401" class="small" text-anchor="start">F</text><text x="483" y="400" class="small" text-anchor="start">G</text><text x="536" y="400" class="small" text-anchor="start">H</text><path d="M520 413L562 413" class="flow" /><text x="542" y="385" class="" text-anchor="start">U</text><text x="514" y="468" class="small" text-anchor="start">p<tspan baseline-shift="sub" font-size=".75em">atm</tspan></text><path d="M582 379L582 409" class="flow" /><path d="M582 453L582 421" class="flow" /><text x="591" y="400" class="small" text-anchor="start">r</text><path d="M709 455L709 117" class="flow" /><path d="M703 455L1149 455" class="flow" /><text x="710" y="92" class="small" text-anchor="start">Volumetric energy</text><path d="M709 420L1140 420" class="grid" /><text x="695" y="425" class="small" text-anchor="end">0</text><path d="M709 331L1140 331" class="grid" /><text x="695" y="336" class="small" text-anchor="end">ρgh</text><path d="M709 242L1140 242" class="grid" /><text x="695" y="247" class="small" text-anchor="end">p<tspan baseline-shift="sub" font-size=".75em">atm</tspan></text><path d="M709 153L1140 153" class="grid" /><text x="695" y="158" class="small" text-anchor="end">p<tspan baseline-shift="sub" font-size=".75em">atm</tspan> + ρgh</text><path d="M742 153L1110 153" class="wall" /><text x="858" y="139" class="small" text-anchor="start">B = constant</text><path d="M744 242L848 153H900C1008 154 1068 183 1108 242" class="" fill="none" stroke="#285e75" stroke-width="3"/><path d="M744 331L848 420H1108" class="" fill="none" stroke="#a58139" stroke-width="2.5" stroke-dasharray="8 5"/><path d="M744 420H900C1008 419 1068 391 1108 331" class="" fill="none" stroke="#519384" stroke-width="3" stroke-dasharray="2 4"/><text x="744" y="485" class="small" text-anchor="middle">A</text><text x="796" y="485" class="small" text-anchor="middle">B</text><text x="848" y="485" class="small" text-anchor="middle">C</text><text x="900" y="485" class="small" text-anchor="middle">D</text><text x="952" y="485" class="small" text-anchor="middle">E</text><text x="1004" y="485" class="small" text-anchor="middle">F</text><text x="1056" y="485" class="small" text-anchor="middle">G</text><text x="1108" y="485" class="small" text-anchor="middle">H</text><path d="M752 517L789 517" class="line" /><text x="802" y="523" class="small" text-anchor="start">p</text><path d="M865 517H902" class="" stroke="#519384" stroke-width="3" stroke-dasharray="2 4"/><text x="914" y="523" class="small" text-anchor="start">½ρU²</text><path d="M1011 517H1048" class="" stroke="#a58139" stroke-width="3" stroke-dasharray="8 5"/><text x="1060" y="523" class="small" text-anchor="start">ρgz</text><text x="95" y="543" class="small" text-anchor="start">A → C: trade gravitational potential for pressure.</text><text x="95" y="571" class="small" text-anchor="start">Along the bottom: trade pressure for kinetic energy.</text><text x="95" y="599" class="small" text-anchor="start">At H the free jet has p = p<tspan baseline-shift="sub" font-size=".75em">atm</tspan>.</text><text x="718" y="572" class="small" text-anchor="start">A–E: Bernoulli is enough to solve the problem.</text><text x="718" y="599" class="small" text-anchor="start">F–G: this relation alone does not give p or U.</text><text x="600" y="643" class="small" text-anchor="middle">Qualitative energy profiles; positions are labeled stations, not equal distances.</text></svg>