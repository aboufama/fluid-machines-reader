<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 670" role="img"><title>Streamfunction: flux across a path and flow over a backward-facing step</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="38" class="title" text-anchor="start">Flux across a differential path</text><text x="450" y="38" class="title" text-anchor="start">Backward-facing step</text><path d="M65 400 Q145 230 365 130" class="wall" /><text x="42" y="429" class="" text-anchor="start">to O</text><text x="363" y="113" class="" text-anchor="start">to A</text><path d="M98 345 L323 345 L323 151" class="line dash" /><path d="M98 377L323 377" class="dim" /><text x="207" y="403" class="" text-anchor="middle">dx</text><path d="M365 345L365 151" class="dim" /><text x="378" y="254" class="" text-anchor="start">dy</text><path d="M178 251L216 292" class="flow" /><text x="211" y="319" class="" text-anchor="start">u dy − v dx</text><path d="M35 260L93 260" class="flow" /><text x="34" y="240" class="" text-anchor="start">u dy</text><path d="M306 258L350 258" class="flow" /><text x="305" y="237" class="" text-anchor="start">u dy</text><path d="M226 138L226 178" class="flow" /><text x="240" y="159" class="" text-anchor="start">(−v) dx</text><path d="M222 348L222 390" class="flow" /><text x="241" y="371" class="" text-anchor="start">(−v) dx</text><text x="32" y="455" class="" text-anchor="start">n̂ ds = dy x̂ − dx ŷ</text><text x="32" y="487" class="" text-anchor="start">ψ(A) = ∫ₒᴬ (u dy − v dx)</text><path d="M470 100 H1065 M470 220 H565 V382 H1065" class="wall" /><path d="M475 118 C570 118 700 119 1040 119" class="flow" /><text x="1050" y="124" class="small" text-anchor="start">ψ = 2</text><path d="M475 134 C570 134 700 161 1040 161" class="flow" /><text x="1050" y="166" class="small" text-anchor="start">ψ = 1</text><path d="M475 150 C570 150 700 203 1040 203" class="flow" /><text x="1050" y="208" class="small" text-anchor="start">ψ = 0</text><path d="M475 166 C570 166 700 245 1040 245" class="flow" /><text x="1050" y="250" class="small" text-anchor="start">ψ = -1</text><path d="M475 182 C570 182 700 287 1040 287" class="flow" /><text x="1050" y="292" class="small" text-anchor="start">ψ = -2</text><path d="M475 198 C570 198 700 329 1040 329" class="flow" /><text x="1050" y="334" class="small" text-anchor="start">ψ = -3</text><path d="M585 325 C585 282 795 282 795 325 C795 368 585 368 585 325" class="line dash" /><text x="590" y="375" class="small" text-anchor="start">ψ = -4</text><path d="M620 359L742.5 350.8" class="line" /><path d="M611 325 C611 294 769 294 769 325 C769 356 611 356 611 325" class="line dash" /><text x="695" y="375" class="small" text-anchor="start">ψ = -5</text><path d="M725 359L729.5 343.6" class="line" /><path d="M637 325 C637 306 743 306 743 325 C743 344 637 344 637 325" class="line dash" /><text x="800" y="375" class="small" text-anchor="start">ψ = -6</text><path d="M830 359L716.5 336.4" class="line" /><text x="470" y="79" class="small" text-anchor="start">inlet</text><text x="1005" y="79" class="small" text-anchor="start">outlet</text><text x="462" y="417" class="small" text-anchor="start">Close spacing: higher speed</text><text x="825" y="417" class="small" text-anchor="start">Wide spacing: lower speed</text><text x="451" y="459" class="title" text-anchor="start">Constant ψ along a streamline</text><path d="M820 620 Q745 530 710 500 M820 620 Q880 530 1030 500" class="line" /><path d="M710 500L1030 500" class="flow" /><text x="691" y="493" class="" text-anchor="start">A</text><text x="1035" y="493" class="" text-anchor="start">B</text><text x="816" y="645" class="" text-anchor="start">O</text><text x="860" y="483" class="small" text-anchor="start">streamline AB</text><path d="M815 540L864 540" class="flow" /><path d="M800 571L841 571" class="flow" /><text x="453" y="511" class="" text-anchor="start">No flow crosses AB.</text><text x="453" y="546" class="" text-anchor="start">Conservation of mass on OAB:</text><text x="453" y="580" class="" text-anchor="start">∫ₒᴬ (areal flux) ds = ∫ₒᴮ (areal flux) ds</text><text x="453" y="617" class="" text-anchor="start">ψ(A) = ψ(B)</text><text x="30" y="638" class="small" text-anchor="start">Qualitative schematic; ψ levels follow the source.</text></svg>