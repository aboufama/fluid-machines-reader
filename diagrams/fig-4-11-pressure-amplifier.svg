<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"><title>Stepped solid piston pressure amplifier</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#e8e3d9"/><path d="M0 10L10 0" stroke="#9b8a70"/></pattern></defs><path d="M100 151H530V110M530 75H777M100 275H530V344H777" class="wall" /><path d="M415 155H610V80H651V340H610V272H415Z" class="wall" style="fill:url(#hatch)"/><text x="168" y="237" class="" text-anchor="start">p₂</text><text x="719" y="293" class="" text-anchor="start">p₁</text><text x="452" y="98" class="" text-anchor="start">p<tspan baseline-shift="sub" font-size=".75em">atm</tspan></text><path d="M475 105L554 130" class="flow" /><path d="M338 214L410 214" class="flow" /><text x="201" y="197" class="" text-anchor="start">F₂ = p₂A₂</text><path d="M755 214L657 214" class="flow" /><text x="690" y="192" class="" text-anchor="start">F₁ = p₁A₁</text><path d="M539 312L606 312" class="flow" /><text x="278" y="338" class="" text-anchor="start">F₃ = p<tspan baseline-shift="sub" font-size=".75em">atm</tspan>(A₁ − A₂)</text><text x="373" y="145" class="" text-anchor="start">A₂</text><text x="665" y="112" class="" text-anchor="start">A₁</text><text x="86" y="386" class="small" text-anchor="start">Rigid piston • shoulder exposed to atmosphere • F₂ + F₃ = F₁</text></svg>