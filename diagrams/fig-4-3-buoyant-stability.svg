<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 700" role="img"><title>Stable and unstable floating configurations</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="33" class="title" text-anchor="start">Buoyantly stable configuration</text><text x="30" y="354" class="title" text-anchor="start">Buoyantly unstable configuration</text><path d="M30 132L710 132" class="line" /><path d="M30 435L710 435" class="line" /><rect x="65" y="110" width="225" height="100" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><path d="M405 143L626 98L646 197L425 241Z" class="wall" /><rect x="115" y="397" width="92" height="225" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><path d="M452 406L542 388L587 609L497 627Z" class="wall" /><circle cx="177.00" cy="155.00" r="3" fill="#285e75"/><circle cx="177.00" cy="170.00" r="3" fill="#285e75"/><path d="M177 155L177 206" class="flow" /><path d="M177 170L177 106" class="flow" /><text x="188" y="155" class="small" text-anchor="start">CG</text><text x="165" y="187" class="small" text-anchor="end">CB</text><circle cx="530.00" cy="163.00" r="3" fill="#285e75"/><circle cx="512.00" cy="184.00" r="3" fill="#285e75"/><path d="M530 163L530 214" class="flow" /><path d="M512 184L512 120" class="flow" /><text x="541" y="163" class="small" text-anchor="start">CG</text><text x="500" y="201" class="small" text-anchor="end">CB</text><circle cx="162.00" cy="495.00" r="3" fill="#285e75"/><circle cx="162.00" cy="525.00" r="3" fill="#285e75"/><path d="M162 495L162 546" class="flow" /><path d="M162 525L162 461" class="flow" /><text x="173" y="495" class="small" text-anchor="start">CG</text><text x="150" y="542" class="small" text-anchor="end">CB</text><circle cx="529.00" cy="500.00" r="3" fill="#285e75"/><circle cx="546.00" cy="531.00" r="3" fill="#285e75"/><path d="M529 500L529 551" class="flow" /><path d="M546 531L546 467" class="flow" /><text x="492" y="496" class="small" text-anchor="start">CG</text><text x="570" y="548" class="small" text-anchor="end">CB</text><path d="M519 77A27 27 0 1 1 550 63" class="flow" /><path d="M544 369A27 27 0 1 0 514 359" class="flow" /><text x="710" y="93" class="small" text-anchor="start">CCW tilt submerges more</text><text x="710" y="118" class="small" text-anchor="start">of the left side. CB shifts</text><text x="710" y="143" class="small" text-anchor="start">left relative to CG: a</text><text x="710" y="168" class="small" text-anchor="start">restoring torque.</text><text x="710" y="420" class="small" text-anchor="start">CCW tilt moves the</text><text x="710" y="445" class="small" text-anchor="start">submerged region right.</text><text x="710" y="470" class="small" text-anchor="start">CB shifts right relative</text><text x="710" y="495" class="small" text-anchor="start">to CG: a destabilizing</text><text x="710" y="520" class="small" text-anchor="start">torque.</text><text x="35" y="286" class="small" text-anchor="start">Upright: forces aligned</text><text x="395" y="286" class="small" text-anchor="start">Tilted: restoring clockwise torque</text><text x="35" y="668" class="small" text-anchor="start">The tall object falls to one side, approaching the stable configuration above.</text></svg>