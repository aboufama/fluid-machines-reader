<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img"><title>Floating foam, hollow ship and flooded ship</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><path d="M35 135L865 135" class="line" /><text x="810" y="126" class="small" text-anchor="start">air</text><text x="810" y="158" class="small" text-anchor="start">water</text><text x="130" y="45" class="title" text-anchor="middle">Floating foam</text><text x="440" y="45" class="title" text-anchor="middle">Floating ship</text><text x="730" y="45" class="title" text-anchor="middle">Flooded ship</text><rect x="55" y="85" width="160" height="57" fill="#e4ead9" stroke="#285e75" stroke-width="2"/><rect x="55" y="135" width="160" height="7" fill="#b4ced8" stroke="#285e75" stroke-width="2"/><text x="130" y="115" class="" text-anchor="middle">foam</text><path d="M305 100Q305 215 430 265Q555 215 555 100" class="wall" /><path d="M310 135Q320 215 430 265Q540 215 550 135Z" class="" fill="#cce3ec"/><path d="M635 110Q613 183 681 270Q805 255 838 165" class="" fill="none" stroke="#a08e71" stroke-width="10"/><path d="M635 110Q613 183 681 270Q805 255 838 165" class="wall" /><text x="437" y="186" class="" text-anchor="middle">air in hull</text><text x="737" y="191" class="" text-anchor="middle">water in hull</text><text x="305" y="312" class="small" text-anchor="start">Shading: displaced water</text><text x="