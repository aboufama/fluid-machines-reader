<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img" aria-labelledby="title desc"><title id="title">Liquid jet falling from an orifice</title><desc id="desc">A liquid jet issues downward from an orifice of width a with initial speed U0 and narrows as it falls. Photograph omitted.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:19px;fill:#172e3c}.small{font-size:16px}.math{font-family:Georgia,serif;font-style:italic;font-size:22px}.wall{fill:none;stroke:#172e3c;stroke-width:3;stroke-linejoin:round}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#arrow)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#arrow);marker-end:url(#arrow)}.water{fill:#e7f3f7;stroke:none}.dash{stroke-dasharray:7 6}</style><rect width="100%" height="100%" fill="white"/><path d="M220 95H320V165Q296 275 289 465H251Q244 275 220 165Z" class="water"/><path d="M220 95V165Q244 275 251 465M320 95V165Q296 275 289 465" class="wall"/><path d="M220 65L320 65" class="dim"/><path d="M220 45L220 85" class="line"/><path d="M320 45L320 85" class="line"/><text x="270" y="51" class="math" text-anchor="middle">a</text><path d="M240 108L240 157" class="flow"/><path d="M270 108L270 157" class="flow"/><path d="M300 108L300 157" class="flow"/><text x="160" y="145" class="math" text-anchor="start">U₀</text><text x="388" y="148" class="" text-anchor="start">Orifice</text><path d="M375 155L324 165" class="flow"/><text x="380" y="315" class="" text-anchor="start">Liquid jet</text><path d="M370 307L297 320" class="flow"/></svg>