<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 580" role="img"><title>Figure 9.6 — two paths to the Laplace equation</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="25" y="35" class="title" text-anchor="start">Two-dimensional, constant-density flow</text><rect x="20" y="90" width="300" height="120" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="170" y="118" class="" text-anchor="middle">Conservation of mass</text><text x="170" y="146" class="" text-anchor="middle">divergence-free velocity</text><text x="170" y="174" class="" text-anchor="middle">∇ · <tspan font-weight="600">u</tspan> = 0</text><rect x="720" y="90" width="300" height="120" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="870" y="118" class="" text-anchor="middle">Require irrotational flow</text><text x="870" y="146" class="" text-anchor="middle">curl-free velocity</text><text x="870" y="174" class="" text-anchor="middle">∇ × <tspan font-weight="600">u</tspan> = 0</text><rect x="375" y="90" width="300" height="120" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="525" y="118" class="" text-anchor="middle">Define streamfunction ψ</text><text x="525" y="146" class="" text-anchor="middle">u = ∂ψ/∂y</text><text x="525" y="174" class="" text-anchor="middle">v = −∂ψ/∂x</text><path d="M320 150L370 150" class="flow" /><path d="M675 150L715 150" class="flow" /><text x="688" y="126" class="small" text-anchor="middle">then</text><path d="M870 210L870 260" class="flow" /><text x="870" y="291" class="title" text-anchor="middle">∇²ψ = 0</text><rect x="20" y="375" width="300" height="120" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="170" y="403" class="" text-anchor="middle">Irrotational velocity</text><text x="170" y="431" class="" text-anchor="middle">curl-free velocity</text><text x="170" y="459" class="" text-anchor="middle">∇ × <tspan font-weight="600">u</tspan> = 0</text><rect x="375" y="375" width="300" height="120" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="525" y="403" class="" text-anchor="middle">Define velocity potential φ</text><text x="525" y="431" class="" text-anchor="middle"><tspan font-weight="600">u</tspan> = ∇φ</text><rect x="720" y="375" width="300" height="120" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="870" y="403" class="" text-anchor="middle">Require conservation of mass</text><text x="870" y="431" class="" text-anchor="middle">divergence-free velocity</text><text x="870" y="459" class="" text-anchor="middle">∇ · <tspan font-weight="600">u</tspan> = 0</text><path d="M320 435L370 435" class="flow" /><path d="M675 435L715 435" class="flow" /><text x="688" y="410" class="small" text-anchor="middle">then</text><path d="M870 495L870 527" class="flow" /><text x="870" y="556" class="title" text-anchor="middle">∇²φ = 0</text><text x="35" y="270" class="title" text-anchor="start">Streamfunction route</text><text x="35" y="555" class="title" text-anchor="start">Velocity-potential route</text></svg>