<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 880" role="img"><title>Reservoir siphon with labeled stations and height dimensions</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="35" y="35" class="title" text-anchor="start">Reservoir and siphon</text><path d="M195 200V690Q420 825 700 690V200" class="wall" /><path d="M195 200C195 110 700 110 700 200C700 290 195 290 195 200" class="wall" /><path d="M197 680Q420 588 697 680" class="line dash" /><path d="M197 310H697V690Q420 821 197 690Z" class="" fill="#e9f4f8" opacity=".8"/><path d="M195 310H696" class="line dash" /><path d="M665 680V207C665 135 755 135 755 207V710M690 680V207C690 168 730 168 730 207V710" class="wall" /><path d="M677 600L677 535" class="flow" /><path d="M677 414L677 355" class="flow" /><path d="M742 300L742 365" class="flow" /><path d="M742 530L742 595" class="flow" /><path d="M742 690L742 751" class="flow" /><path d="M122 200L122 690" class="dim" /><path d="M160 310L160 690" class="dim" /><text x="97" y="450" class="" text-anchor="start">h₁</text><text x="139" y="518" class="" text-anchor="start">h</text><text x="45" y="91" class="" text-anchor="start">Exposed to atmosphere</text><path d="M200 99L277 174" class="flow" /><text x="502" y="92" class="" text-anchor="start">Cross-sectional area very large</text><path d="M585 108L537 175" class="flow" /><text x="300" y="345" class="" text-anchor="start">Initial water level</text><text x="780" y="318" class="" text-anchor="start">z = h</text><text x="780" y="718" class="" text-anchor="start">z = 0</text><text x="213" y="330" class="" text-anchor="start">A</text><text x="213" y="691" class="" text-anchor="start">B</text><text x="624" y="680" class="" text-anchor="start">C</text><text x="673" y="715" class="" text-anchor="start">D</text><text x="706" y="140" class="" text-anchor="start">E</text><text x="766" y="751" class="" text-anchor="start">F</text><text x="298" y="587" class="" text-anchor="start">Intake extends almost,</text><text x="298" y="613" class="" text-anchor="start">but not quite, to bottom</text><path d="M531 622L664 680" class="flow" /><path d="M794 809L864 809" class="flow" /><text x="872" y="815" class="" text-anchor="start">x</text><path d="M794 809L824 779" class="flow" /><text x="832" y="785" class="" text-anchor="start">y</text><path d="M794 809L794 752" class="flow" /><text x="802" y="758" class="" text-anchor="start">z</text><text x="35" y="853" class="small" text-anchor="start">Height h: initial water level to datum. Height h₁: rim level to the same datum.</text></svg>