="start">A₂</text><path d="M360 423H446C490 423 495 455 552 455V482C495 482 490 521 446 521H360Z" class="line dash" /><text x="470" y="403" class="small" text-anchor="middle">Control volume</text><path d="M284 470L353 470" class="flow" /><path d="M559 470L629 470" class="flow" /><text x="100" y="475" class="title" text-anchor="start">ṁ = −ρU₁A₁</text><text x="646" y="475" class="title" text-anchor="start">ṁ = ρU₂A₂</text><text x="226" y="562" class="title" text-anchor="start">U₂ = U₁ A₁ / A₂</text><text x="600" y="562" class="title" text-anchor="start">p₁ − p₂ = ½ρ(U₂² − U₁²)</text></svg>