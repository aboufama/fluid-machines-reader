<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" role="img"><title>Momentum flux averaging at molecular and continuum scales</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="550" y="35" class="title" text-anchor="middle">Momentum flux averaging</text><text x="185" y="84" class="" text-anchor="middle">Molecular level</text><rect x="30" y="108" width="310" height="255" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="550" y="84" class="" text-anchor="middle">Instantaneous continuum</text><rect x="395" y="108" width="310" height="255" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="915" y="84" class="" text-anchor="middle">Time-averaged continuum</text><rect x="760" y="108" width="310" height="255" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><circle cx="53.00" cy="134.00" r="4" fill="#285e75"/><circle cx="120.00" cy="177.00" r="4" fill="#285e75"/><circle cx="187.00" cy="220.00" r="4" fill="#285e75"/><circle cx="254.00" cy="165.00" r="4" fill="#285e75"/><circle cx="57.00" cy="208.00" r="4" fill="#285e75"/><circle cx="124.00" cy="153.00" r="4" fill="#285e75"/><circle cx="191.00" cy="196.00" r="4" fill="#285e75"/><circle cx="258.00" cy="141.00" r="4" fill="#285e75"/><circle cx="61.00" cy="184.00" r="4" fill="#285e75"/><circle cx="128.00" cy="227.00" r="4" fill="#285e75"/><circle cx="195.00" cy="172.00" r="4" fill="#285e75"/><circle cx="262.00" cy="215.00" r="4" fill="#285e75"/><circle cx="65.00" cy="160.00" r="4" fill="#285e75"/><circle cx="132.00" cy="203.00" r="4" fill="#285e75"/><circle cx="199.00" cy="148.00" r="4" fill="#285e75"/><circle cx="266.00" cy="191.00" r="4" fill="#285e75"/><circle cx="69.00" cy="136.00" r="4" fill="#285e75"/><circle cx="136.00" cy="179.00" r="4" fill="#285e75"/><circle cx="203.00" cy="222.00" r="4" fill="#285e75"/><circle cx="270.00" cy="167.00" r="4" fill="#285e75"/><circle cx="73.00" cy="210.00" r="4" fill="#285e75"/><circle cx="140.00" cy="155.00" r="4" fill="#285e75"/><text x="185" y="277" class="small" text-anchor="middle">Each molecule has its own</text><text x="185" y="310" class="small" text-anchor="middle">position x(t) and velocity v⃗(t).</text><text x="550" y="185" class="" text-anchor="middle">u⃗(x, y, z, t)</text><text x="550" y="223" class="" text-anchor="middle">p(x, y, z, t)</text><text x="550" y="295" class="small" text-anchor="middle">Time-dependent</text><text x="550" y="321" class="small" text-anchor="middle">velocity and pressure fields</text><text x="915" y="185" class="" text-anchor="middle">u̅⃗(x, y, z)</text><text x="915" y="223" class="" text-anchor="middle">p̅(x, y, z)</text><text x="915" y="295" class="small" text-anchor="middle">Time-averaged</text><text x="915" y="321" class="small" text-anchor="middle">velocity and pressure fields</text><path d="M345 230L386 230" class="flow" /><path d="M710 230L751 230" class="flow" /><text x="35" y="417" class="title" text-anchor="start">Continuum approximation</text><text x="35" y="455" class="small" text-anchor="start">Average over the time and distance associated</text><text x="35" y="483" class="small" text-anchor="start">with molecular collisions: 1 Å–1 μm; 1 ps–1 μs.</text><text x="35" y="511" class="small" text-anchor="start"></text><text x="35" y="539" class="small" text-anchor="start">Two types of information are lost:</text><text x="35" y="567" class="small" text-anchor="start">• Molecular fluctuations generate an isotropic stress.</text><text x="35" y="595" class="small" text-anchor="start">• Nonuniform continuum velocity also gives</text><text x="35" y="623" class="small" text-anchor="start">  an additional anisotropic stress.</text><text x="35" y="651" class="small" text-anchor="start"></text><text x="35" y="679" class="small" text-anchor="start">Account for these stresses using</text><text x="35" y="707" class="small" text-anchor="start">pressure p:  τ = pI</text><text x="35" y="735" class="small" text-anchor="start">viscosity μ:  τ = 2μE</text><text x="625" y="417" class="title" text-anchor="start">Reynolds averaging</text><text x="625" y="455" class="small" text-anchor="start">Average over the rotation time of the</text><text x="625" y="483" class="small" text-anchor="start">largest vortices: 1 ms–10 s.</text><text x="625" y="511" class="small" text-anchor="start"></text><text x="625" y="539" class="small" text-anchor="start">Time averaging loses the net momentum</text><text x="625" y="567" class="small" text-anchor="start">carried around by unsteady fluid.</text><text x="625" y="595" class="small" text-anchor="start"></text><text x="625" y="623" class="small" text-anchor="start">Introduce a “turbulent viscosity” μ<tspan baseline-shift="sub" font-size="70%">t</tspan>,</text><text x="625" y="651" class="small" text-anchor="start">predicted by a turbulence model:</text><text x="625" y="679" class="small" text-anchor="start"></text><text x="625" y="707" class="small" text-anchor="start">τ = 2μ<tspan baseline-shift="sub" font-size="70%">t</tspan>E</text><text x="550" y="816" class="small" text-anchor="middle">τ, I, and E denote tensors; the stress signs and closure shown follow the source schematic.</text></svg>