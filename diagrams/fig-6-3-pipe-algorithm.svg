<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1240" role="img"><title>Algorithm for relating turbulent pipe flow rate and pressure drop</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="530" y="32" class="title" text-anchor="middle">Turbulent pipe flow: relate Δp and Q</text><rect x="300" y="65" width="460" height="70" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="530.0" y="106.0" class="" text-anchor="middle">Do I know d, ε, ρ, μ and L?</text><path d="M300 100L220 100" class="flow" /><text x="253" y="87" class="small" text-anchor="middle">NO</text><rect x="20" y="65" width="200" height="110" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="120.0" y="103.0" class="" text-anchor="middle">I cannot solve the</text><text x="120.0" y="126.0" class="" text-anchor="middle">problem without</text><text x="120.0" y="149.0" class="" text-anchor="middle">these parameters.</text><path d="M530 135L530 205" class="flow" /><text x="542" y="177" class="small" text-anchor="start">YES</text><rect x="300" y="205" width="460" height="70" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="530.0" y="246.0" class="" text-anchor="middle">Which quantity am I calculating?</text><path d="M400 275V310H265V350" class="flow" /><path d="M660 275V310H805V350" class="flow" /><text x="245" y="337" class="" text-anchor="end">Use Δp to find Q</text><text x="825" y="337" class="" text-anchor="start">Use Q to find Δp</text><rect x="90" y="350" width="350" height="85" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="265.0" y="398.5" class="" text-anchor="middle">Guess f<tspan baseline-shift="sub" font-size="70%">D</tspan></text><path d="M265 435L265 490" class="flow" /><rect x="90" y="490" width="350" height="85" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="265.0" y="527.0" class="" text-anchor="middle">Use ρ, d, L, Δp and guessed f<tspan baseline-shift="sub" font-size="70%">D</tspan></text><text x="265.0" y="550.0" class="" text-anchor="middle">to calculate a guess for U</text><path d="M265 575L265 630" class="flow" /><rect x="90" y="630" width="350" height="85" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="265.0" y="667.0" class="" text-anchor="middle">Use ρ, d, μ and guessed U</text><text x="265.0" y="690.0" class="" text-anchor="middle">to calculate a guess for Re<tspan baseline-shift="sub" font-size="70%">d</tspan></text><path d="M265 715L265 770" class="flow" /><rect x="90" y="770" width="350" height="85" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="265.0" y="807.0" class="" text-anchor="middle">Use Re<tspan baseline-shift="sub" font-size="70%">d</tspan> and ε/d with Haaland</text><text x="265.0" y="830.0" class="" text-anchor="middle">or Moody to refine f<tspan baseline-shift="sub" font-size="70%">D</tspan></text><path d="M265 855L265 910" class="flow" /><rect x="90" y="910" width="350" height="85" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="265.0" y="947.0" class="" text-anchor="middle">Is the new f<tspan baseline-shift="sub" font-size="70%">D</tspan> close enough</text><text x="265.0" y="970.0" class="" text-anchor="middle">to the last guess?</text><rect x="630" y="350" width="350" height="85" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="805.0" y="398.5" class="" text-anchor="middle">Use Q and d to get U</text><path d="M805 435L805 490" class="flow" /><rect x="630" y="490" width="350" height="85" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="805.0" y="538.5" class="" text-anchor="middle">Use U, ρ, d and μ to get Re<tspan baseline-shift="sub" font-size="70%">d</tspan></text><path d="M805 575L805 630" class="flow" /><rect x="630" y="630" width="350" height="85" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="805.0" y="667.0" class="" text-anchor="middle">Use Re<tspan baseline-shift="sub" font-size="70%">d</tspan> and ε/d to get f<tspan baseline-shift="sub" font-size="70%">D</tspan></text><text x="805.0" y="690.0" class="" text-anchor="middle">from Moody chart or Haaland</text><path d="M805 715L805 770" class="flow" /><rect x="630" y="770" width="350" height="85" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="805.0" y="807.0" class="" text-anchor="middle">Use f<tspan baseline-shift="sub" font-size="70%">D</tspan>, ρ, U, d and L</text><text x="805.0" y="830.0" class="" text-anchor="middle">to calculate Δp</text><path d="M90 952H45V390H90" class="flow" /><text x="60" y="870" class="small" text-anchor="start">NO</text><text x="65" y="1050" class="small" text-anchor="start">Update the guess with the new f<tspan baseline-shift="sub" font-size="70%">D</tspan>.</text><text x="65" y="1080" class="small" text-anchor="start">Iteration is needed because U is used</text><text x="65" y="1104" class="small" text-anchor="start">to nondimensionalize Δp in f<tspan baseline-shift="sub" font-size="70%">D</tspan>.</text><path d="M440 952H630" class="flow" /><text x="530" y="938" class="small" text-anchor="middle">YES</text><rect x="630" y="910" width="350" height="110" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="805.0" y="948.0" class="" text-anchor="middle">The last f<tspan baseline-shift="sub" font-size="70%">D</tspan> was good enough.</text><text x="805.0" y="971.0" class="" text-anchor="middle">Use the calculated U and d</text><text x="805.0" y="994.0" class="" text-anchor="middle">to calculate Q.</text><path d="M980 812H1015V1135H950" class="flow" /><path d="M805 1020V1135H850" class="flow" /><rect x="800" y="1105" width="150" height="60" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><text x="875.0" y="1141.0" class="" text-anchor="middle">DONE</text></svg>