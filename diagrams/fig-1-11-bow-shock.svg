<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img"><title>Sphere and detached bow shock: explanatory schematic</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="450" y="35" class="title" text-anchor="middle">Schematic reconstruction of the schlieren image</text><path d="M760 85 Q400 235 400 310 Q400 405 760 530" class="wall" /><circle cx="477.00" cy="310.00" r="43" fill="#899ba4"/><path d="M245 240L340 240" class="flow" /><path d="M245 310L340 310" class="flow" /><path d="M245 380L340 380" class="flow" /><text x="40" y="170" class="" text-anchor="start">Upstream</text><text x="40" y="205" class="" text-anchor="start">U = 750 m/s</text><text x="40" y="233" class="" text-anchor="start">p = 1 atm</text><text x="40" y="261" class="" text-anchor="start">ρ = 1.2 kg/m³</text><text x="40" y="289" class="" text-anchor="start">T = 273 K</text><text x="585" y="260" class="" text-anchor="start">Just behind central shock</text><text x="610" y="295" class="" text-anchor="start">U = 260 m/s</text><text x="610" y="323" class="" text-anchor="start">p = 5.2 atm</text><text x="610" y="351" class="" text-anchor="start">ρ = 3.4 kg/m³</text><text x="610" y="379" class="" text-anchor="start">T = 490 K</text><path d="M580 285L413 310" class="flow" /><text x="530" y="427" class="" text-anchor="start">Detached bow shock</text><path d="M540 433L500 448" cl