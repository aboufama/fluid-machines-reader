<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" role="img" aria-labelledby="title desc"><title id="title">Rocket engine and thrust equation</title><desc id="desc">Fuel and oxidizer enter a combustion chamber. Subsonic hot pressurized gas passes through a throat and expands in a diverging nozzle to a supersonic exhaust. Redrawn from Figure 1.2; photograph omitted.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:19px;fill:#172e3c}.small{font-size:16px}.math{font-family:Georgia,serif;font-style:italic;font-size:22px}.wall{fill:none;stroke:#172e3c;stroke-width:3;stroke-linejoin:round}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#arrow)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#arrow);marker-end:url(#arrow)}.water{fill:#e7f3f7;stroke:none}.dash{stroke-dasharray:7 6}</style><rect width="100%" height="100%" fill="white"/><path d="M145 170H310C350 170 350 230 385 230S470 155 625 148L735 145M145 350H310C350 350 350 290 385 290S470 365 625 372L735 375M145 170V350" class="wall"/><text x="175" y="145" class="" text-anchor="start">Combustion chamber</text><text x="515" y="115" class="" text-anchor="start">Nozzle</text><text x="183" y="220" class="" text-anchor="start">Combustion</text><text x="190" y="255" class="" text-anchor="start">high T, high p</text><text x="220" y="287" class="math" text-anchor="start">M &lt; 1</text><text x="385" y="333" class="" text-anchor="middle">Throat</text><path d="M385 313L385 290" class="flow"/><text x="510" y="223" class="" text-anchor="start">Expansion</text><text x="480" y="255" class="" text-anchor="start">Convert T, p into</text><text x="480" y="282" class="" text-anchor="start">fluid kinetic energy</text><text x="555" y="320" class="math" text-anchor="start">M &gt; 1</text><text x="50" y="90" class="" text-anchor="start">Fuel</text><path d="M105 100L105 210" class="line"/><path d="M105 210L175 210" class="flow"/><text x="35" y="420" class="" text-anchor="start">Oxidizer</text><path d="M110 400L110 320" class="line"/><path d="M110 320L190 320" class="flow"/><path d="M750 170L840 170" class="flow"/><path d="M750 202L840 202" class="flow"/><path d="M750 234L840 234" class="flow"/><path d="M750 266L840 266" class="flow"/><path d="M750 298L840 298" class="flow"/><path d="M750 330L840 330" class="flow"/><path d="M750 362L840 362" class="flow"/><text x="790" y="140" class="" text-anchor="middle">Exhaust</text><text x="450" y="465" class="math" text-anchor="middle">F<tspan baseline-shift="sub" font-size="70%" font-style="normal">t</tspan> = ṁ U<tspan baseline-shift="sub" font-size="70%" font-style="normal">exhaust</tspan> + Δp A<tspan baseline-shift="sub" font-size="70%" font-style="normal">exhaust</tspan></text><text x="450" y="508" class="" text-anchor="middle">Thrust primarily generated by maximizing mass flow</text><text x="450" y="534" class="" text-anchor="middle">and exhaust speed.</text></svg>