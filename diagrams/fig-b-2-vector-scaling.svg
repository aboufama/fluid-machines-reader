<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 285" role="img"><title>Positive scalar multiplication of a vector</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="34" class="title" text-anchor="start">Scalar multiplication</text><path d="M45 212L185 162" class="flow" /><text x="95.0" y="160.0" class="" text-anchor="start">a⃗</text><path d="M290 212L500.0 137.0" class="flow" /><text x="375.0" y="147.5" class="" text-anchor="start">(3/2) a⃗</text><path d="M595 212L875 112" class="flow" /><text x="715.0" y="135.0" class="" text-anchor="start">2a⃗</text><text x="30" y="265" class="small" text-anchor="start">Lengths scale by 1, 3/2, and 2; all three directions stay the same.</text></svg>