<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 670" role="img"><title>Pressure and gravity forces on a cylindrical control volume</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="485" y="34" class="title" text-anchor="middle">Finite fluid control volume</text><path d="M257 196V506C257 550 537 550 537 506V196" class="" fill="#edf5f7" stroke="#285e75" stroke-width="2"/><ellipse cx="397" cy="196" rx="140" ry="33" fill="#d9e9ef" stroke="#285e75" stroke-width="2"/><path d="M257 506Q397 449 537 506" class="line dash" /><text x="170" y="201" class="" text-anchor="start">z = z₂</text><text x="170" y="517" class="" text-anchor="start">z = z₁</text><text x="316" y="206" class="small" text-anchor="start">Area A</text><path d="M397 91L397 184" class="flow" /><text x="429" y="111" class="" text-anchor="start">F<tspan baseline-shift="sub" font-size=".75em">p,z</tspan> = −p₂A</text><path d="M397 622L397 520" class="flow" /><text x="429" y="619" class="" text-anchor="start">F<tspan baseline-shift="sub" font-size=".75em">p,z</tspan> = p₁A</text><path d="M397 331L397 428" class="flow" /><text x="397" y="315" class="" text-anchor="middle">F<tspan baseline-shift="sub" font-size=".75em">g,z</tspan> = −ρgA(z₂ − z₁)</text><text x="625" y="267" class="" text-anchor="start">Vertical side surfaces:</text><text x="625" y="295" class="" text-anchor="start">no z-component</text><text x="625" y="323" class="" text-anchor="start">of pressure force.</text><path d="M605 328L541 360" class="flow" /><path d="M745 501L820 501" class="flow" /><text x="830" y="507" class="small" text-anchor="start">y</text><path d="M745 501L745 416" class="flow" /><text x="755" y="422" class="small" text-anchor="start">z</text><path d="M745 501L690 545" class="flow" /><text x="700" y="551" class="small" text-anchor="start">x</text><text x="485" y="662" class="small" text-anchor="middle">Labels are signed z-components; force arrows show their physical directions.</text></svg>