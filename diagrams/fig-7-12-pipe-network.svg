<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 590" role="img"><title>Simple branched pipe network with eight volume flow labels</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="35" class="title" text-anchor="start">A simple pipe network</text><path d="M55 265H345V130H740V265H1000M55 305H345V485H740V305H1000M385 170H700V445H385Z" class="wall" /><path d="M170 284L250 284" class="flow" /><text x="160" y="250" class="" text-anchor="start">Q₁</text><path d="M365 251L365 197" class="flow" /><text x="310" y="209" class="" text-anchor="start">Q₂</text><path d="M478 149L558 149" class="flow" /><text x="475" y="116" class="" text-anchor="start">Q₃</text><path d="M720 198L720 251" class="flow" /><text x="760" y="214" class="" text-anchor="start">Q₄</text><path d="M365 335L365 403" class="flow" /><text x="300" y="374" class="" text-anchor="start">Q₅</text><path d="M478 464L558 464" class="flow" /><text x="475" y="521" class="" text-anchor="start">Q₆</text><path d="M720 403L720 335" class="flow" /><text x="765" y="374" class="" text-anchor="start">Q₇</text><path d="M825 284L905 284" class="flow" /><text x="825" y="250" class="" text-anchor="start">Q₈</text></svg>