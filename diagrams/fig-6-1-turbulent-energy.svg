<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 610" role="img"><title>Turbulent pipe flow and mechanical energy</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="35" class="title" text-anchor="start">Turbulent pipe flow and energy</text><path d="M100 95L840 95" class="wall" /><path d="M100 145L840 145" class="wall" /><text x="20" y="126" class="" text-anchor="start">p inlet</text><text x="850" y="126" class="" text-anchor="start">p outlet</text><path d="M160 120L270 120" class="flow" /><path d="M370 120L480 120" class="flow" /><path d="M640 120L750 120" class="flow" /><text x="400" y="180" class="" text-anchor="start">Flow direction →</text><path d="M390 95L80 280M515 145L870 280" class="line dash" /><path d="M80 280L870 280" class="wall" /><path d="M80 470L870 470" class="wall" /><path d="M200 294L160 294" class="flow" /><path d="M200 456L160 456" class="flow" /><path d="M300 294L260 294" class="flow" /><path d="M300 456L260 456" class="flow" /><path d="M400 294L360 294" class="flow" /><path d="M400 456L360 456" class="flow" /><path d="M500 294L460 294" class="flow" /><path d="M500 456L460 456" class="flow" /><path d="M600 294L560 294" class="flow" /><path d="M600 456L560 456" class="flow" /><path d="M700 294L660 294" class="flow" /><path d="M700 456L660 456" class="flow" /><path d="M800 294L760 294" class="flow" /><path d="M800 456L760 456" class="flow" /><path d="M85 311L190.5976665927953 311" class="flow" /><path d="M85 328L199.93418534936262 328" class="flow" /><path d="M85 345L206.16832164072736 345" class="flow" /><path d="M85 362L210.92126117050964 362" class="flow" /><path d="M85 379L214.79266136554844 379" class="flow" /><path d="M85 396L211.41510035832547 396" class="flow" /><path d="M85 413L206.78817316370527 413" class="flow" /><path d="M85 430L200.7794718197376 430" class="flow" /><path d="M85 447L191.97896674731345 447" class="flow" /><path d="M85 280Q220 287 215 375Q220 463 85 470" class="line" /><text x="80" y="510" class="" text-anchor="start">Turbulent velocity profile</text><text x="320" y="243" class="" text-anchor="start">Pressure decreases downstream →</text><path d="M533 347Q565 322 583 350T608 379Q582 393 588 414Q550 446 535 412T514 385Q503 361 533 347Z" class="line dash" /><text x="544" y="383" class="" text-anchor="start">CV</text><path d="M552 345L552 312" class="flow" /><path d="M590 346L602 312" class="flow" /><path d="M521 390L470 402" class="flow" /><path d="M595 413L633 431" class="flow" /><text x="330" y="542" class="" text-anchor="start">Viscous stresses at the wall retard the flow.</text><text x="330" y="570" class="small" text-anchor="start">Viscosity converts mechanical energy to heat (mostly near walls).</text><text x="330" y="594" class="small" text-anchor="start">Turbulent mixing moves mechanical energy around (mostly in bulk).</text></svg>