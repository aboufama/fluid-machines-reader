<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img"><title>Centrifugal pump: axial inlet, impeller and volute outlet</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#285e75"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172e3c}.small{font-size:15px}.title{font-size:22px;font-weight:600}.wall{fill:none;stroke:#172e3c;stroke-width:3}.line{fill:none;stroke:#285e75;stroke-width:2}.flow{fill:none;stroke:#285e75;stroke-width:2;marker-end:url(#a)}.dim{fill:none;stroke:#285e75;stroke-width:1.5;marker-start:url(#a);marker-end:url(#a)}.grid{fill:none;stroke:#d8e1e5;stroke-width:1}.dash{stroke-dasharray:6 5}</style><rect width="100%" height="100%" fill="white"/><text x="490" y="34" class="title" text-anchor="middle">Centrifugal pump</text><path d="M425 126 C301 72 130 170 139 332 C145 512 366 558 478 438 C521 392 532 340 522 285 L522 97 L465 97 L465 213 C400 113 258 130 211 229 C168 321 220 438 323 447 C414 456 474 389 470 315" class="wall" /><path d="M425 126 C301 72 130 170 139 332 C145 512 366 558 478 438 C521 392 532 340 522 285 L522 97 L465 97 L465 213 C400 113 258 130 211 229 C168 321 220 438 323 447 C414 456 474 389 470 315Z" class="" fill="#eaf3f6" stroke="none"/><g transform="rotate(0 333 304)"><path d="M333 275 C369 262 417 228 420 196" class="wall" /></g><g transform="rotate(60 333 304)"><path d="M333 275 C369 262 417 228 420 196" class="wall" /></g><g transform="rotate(120 333 304)"><path d="M333 275 C369 262 417 228 420 196" class="wall" /></g><g transform="rotate(180 333 304)"><path d="M333 275 C369 262 417 228 420 196" class="wall" /></g><g transform="rotate(240 333 304)"><path d="M333 275 C369 262 417 228 420 196" class="wall" /></g><g transform="rotate(300 333 304)"><path d="M333 275 C369 262 417 228 420 196" class="wall" /></g><circle cx="333.00" cy="304.00" r="43" fill="#fff"/><circle cx="333.00" cy="304.00" r="10" fill="#285e75"/><text x="333" y="370" class="" text-anchor="middle">Eye</text><path d="M231 193 C170 286 179 381 259 433" class="flow" /><path d="M365 469 C459 460 500 390 494 309 L494 74" class="flow" /><text x="533" y="88" class="" text-anchor="start">Outflow</text><text x="26" y="564" class="" text-anchor="start">Volute casing</text><path d="M171 550L206 461" class="flow" /><text x="602" y="206" class="" text-anchor="start">Axial inlet</text><path d="M624 242L374 295" class="flow" /><text x="530" y="313" class="small" text-anchor="start">Inflow to eye</text><text x="603" y="389" class="" text-anchor="start">Impeller</text><path d="M595 378L430 253" class="flow" /><rect x="685" y="449" width="192" height="82" fill="#dbe4e8" stroke="#285e75" stroke-width="2"/><text x="781" y="498" class="" text-anchor="middle">Motor</text><path d="M685 490L566 490" class="wall" /><text x="612" y="526" class="small" text-anchor="middle">Shaft</text><text x="595" y="575" class="small" text-anchor="start">Motor spins the impeller.</text><text x="490" y="608" class="small" text-anchor="middle">Schematic cutaway; inflow is along the rotation axis, then radially outward into the volute.</text></svg>